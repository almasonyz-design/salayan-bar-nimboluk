<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صلایان بار نیمبلوک</title><meta name="theme-color" content="#0b7a4b"><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f5;color:#17231e}.app{max-width:520px;margin:auto;min-height:100vh;background:#f7faf8;box-shadow:0 0 30px #0001}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e4ebe7;padding:14px 16px;display:flex;align-items:center;justify-content:center}.brand{font-weight:900;color:#087a4b;font-size:20px}.brand small{display:block;text-align:center;color:#718078;font-size:10px;margin-top:3px}.screen{display:none;padding:16px 16px 92px}.screen.active{display:block}.logo{text-align:center;padding:24px 0 12px}.logo .truck{font-size:54px}.logo h1{margin:6px 0;color:#087a4b;font-size:26px}.logo p{margin:0;color:#718078}.card{background:#fff;border:1px solid #e3ebe6;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #00000008}.title{font-size:18px;font-weight:900;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{border-radius:15px;padding:13px;background:#fff;border:1px solid #e3ebe6;cursor:pointer}.status.ok{border-right:4px solid #16a05d}.status.bad{border-right:4px solid #d83b3b}.status.warn{border-right:4px solid #e59c22}.status b{display:block;font-size:14px;margin:5px 0}.status span{font-size:12px;color:#66736d}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:bold}.green{background:#e4f7ed;color:#087a4b}.red{background:#fde8e8;color:#b42318}.orange{background:#fff3db;color:#9a6500}.blue{background:#e7f0ff;color:#1d5fbf}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;background:#087a4b;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}.btn.secondary{background:#edf3ef;color:#087a4b}.btn.danger{background:#d83b3b}.input{width:100%;padding:13px;border:1px solid #d5dfda;border-radius:12px;margin:6px 0;font-size:14px;background:#fff}.load{position:relative}.load h3{margin:0 0 9px}.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:6px 0;color:#52615a}.row strong{color:#17231e}.load .kind{position:absolute;left:12px;top:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#fff;border-top:1px solid #dfe8e3;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav button{border:0;background:none;color:#718078;font-size:11px}.nav button.active{color:#087a4b;font-weight:bold}.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);margin:auto 0 0;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto}.close{float:left;border:0;background:#eef2ef;border-radius:10px;padding:7px 10px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#17231e;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:30;font-size:13px}.toast.show{display:block}.empty{text-align:center;color:#77847e;padding:25px}.small{font-size:11px;color:#7a8781;line-height:1.8}.money{font-size:25px;font-weight:900;color:#087a4b}.divider{height:1px;background:#e8eeeb;margin:12px 0}</style></head><body><div class="app"><header class="top"><div class="brand">صلایان بار نیمبلوک<small>اعلام بار هوشمند</small></div></header><main>
<section id="home" class="screen active"><div class="title">وضعیت مدارک و استعلام‌ها</div><div class="grid" id="statusGrid"></div><div class="card"><div class="row"><span>وضعیت کلی</span><strong id="statusSummary"></strong></div><div class="small">این بخش در نسخه آزمایشی است و هنوز به سامانه‌های رسمی متصل نیست.</div></div><div class="title">دسترسی سریع</div><button class="btn" onclick="show('loads')">🚛 تالار بار</button><button class="btn secondary" onclick="show('myloads')">📦 بارهای من</button><button class="btn secondary" onclick="show('announce')">➕ اعلام بار</button></section>
<section id="loads" class="screen"><div class="title">تالار بار</div><div id="loadsBox"></div></section>
<section id="myloads" class="screen"><div class="title">بارهای من</div><div id="myBox"></div></section>
<section id="announce" class="screen"><div class="title">اعلام بار آزمایشی</div><div class="card"><input class="input" id="origin" placeholder="مبدا"><input class="input" id="destination" placeholder="مقصد"><input class="input" id="cargo" placeholder="نوع بار"><input class="input" id="weight" placeholder="وزن (تن)" type="number"><select class="input" id="kind"><option value="نوبتی">نوبتی</option><option value="آزاد">آزاد</option></select><input class="input" id="deadline" type="number" min="1" value="10" placeholder="مهلت نوبت (دقیقه)"><button class="btn" onclick="announceLoad()">ثبت اعلام بار</button><div class="small">قانون نسخه آزمایشی: اگر بار نوبتی تا پایان مهلت انتخاب نشود، خودکار آزاد می‌شود.</div></div></section>
<section id="more" class="screen"><div class="title">بیشتر</div><div class="card"><div class="small">موجودی کیف پول</div><div class="money" id="wallet"></div><button class="btn" onclick="charge()">💳 شارژ کیف پول</button><button class="btn secondary" onclick="transactions()">📒 تراکنش‌ها</button></div><button class="btn secondary" onclick="profile()">👤 پروفایل</button><button class="btn secondary" onclick="truck()">🚚 اطلاعات کامیون</button><button class="btn secondary" onclick="show('home')">📋 استعلام‌ها</button><button class="btn danger" onclick="resetDemo()">بازنشانی نسخه آزمایشی</button></section></main><nav class="nav"><button data-s="home" class="active" onclick="show('home')"><i>🏠</i>خانه</button><button data-s="loads" onclick="show('loads')"><i>🚛</i>تالار بار</button><button data-s="myloads" onclick="show('myloads')"><i>📦</i>بارهای من</button><button data-s="more" onclick="show('more')"><i>☰</i>بیشتر</button></nav></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const FEE=10000, RADIUS=200;const coords={"نیمبلوک":[33.916,58.795],"قاین":[33.7265,59.1844],"مشهد":[36.2605,59.6168],"خواف":[34.5767,60.1426],"بیرجند":[32.8663,59.2211],"چابهار":[25.2919,60.643],"زاهدان":[29.4963,60.8629]};
let wallet=+localStorage.getItem('salayan_wallet')||50000;let tx=JSON.parse(localStorage.getItem('salayan_tx')||'[]');let selected=JSON.parse(localStorage.getItem('salayan_selected')||'[]');let loads=JSON.parse(localStorage.getItem('salayan_loads')||'null')||[
{id:1,origin:'نیمبلوک',destination:'مشهد',cargo:'فولاد',weight:26,kind:'نوبتی',created:Date.now()-2*60000,deadline:Date.now()+8*60000,owner:'شرکت حمل آزمایشی'},
{id:2,origin:'قاین',destination:'بیرجند',cargo:'نهاده دامی',weight:25,kind:'آزاد',created:Date.now()-3600000,deadline:Date.now()-3000000,owner:'اعلام بار آزمایشی'},
{id:3,origin:'نیمبلوک',destination:'خواف',cargo:'سنگ',weight:26,kind:'نوبتی',created:Date.now()-5*60000,deadline:Date.now()+5*60000,owner:'شرکت حمل آزمایشی'}];
function save(){localStorage.setItem('salayan_wallet',wallet);localStorage.setItem('salayan_tx',JSON.stringify(tx));localStorage.setItem('salayan_selected',JSON.stringify(selected));localStorage.setItem('salayan_loads',JSON.stringify(loads));}
function money(n){return n.toLocaleString('fa-IR')+' تومان'}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));if(id==='loads')renderLoads();if(id==='myloads')renderMy();if(id==='more')document.getElementById('wallet').textContent=money(wallet);if(id==='home')renderStatus();scrollTo(0,0)}
function renderStatus(){let a=[['معاینه فنی کامیون','معتبر','ok','تاریخ اعتبار: ۱۴۰۵/۱۰/۱۵'],['کارت سلامت راننده','معتبر','ok','وضعیت: فعال'],['بیمه بدنه کامیون','منقضی','bad','نیازمند تمدید'],['کارت هوشمند راننده','معتبر','ok','وضعیت: فعال'],['استعلام راهداری','معتبر','ok','بدون مغایرت آزمایشی']];document.getElementById('statusGrid').innerHTML=a.map((x,i)=>`<div class="status ${x[2]}" onclick="statusModal('${x[0]}','${x[1]}','${x[3]}')"><span>${['🔧','🩺','🛡️','💳','🛣️'][i]}</span><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');document.getElementById('statusSummary').textContent='۴ معتبر · ۱ منقضی'}
function statusModal(a,b,c){openModal(`<h2>${a}</h2><p><span class="badge ${b==='معتبر'?'green':'red'}">${b}</span></p><p>${c}</p><div class="small">نمایش آزمایشی است و به سامانه رسمی متصل نیست.</div>`)}
function refreshKinds(){let now=Date.now(),changed=false;loads.forEach(l=>{if(l.kind==='نوبتی'&&l.deadline&&now>=l.deadline&&!selected.some(s=>s.id===l.id)){l.kind='آزاد';changed=true}});if(changed)save()}
function renderLoads(){refreshKinds();let box=document.getElementById('loadsBox');if(!loads.length){box.innerHTML='<div class="empty">باری وجود ندارد</div>';return}box.innerHTML=loads.map(l=>{let chosen=selected.some(s=>s.id===l.id);let remain=l.kind==='نوبتی'?Math.max(0,Math.ceil((l.deadline-Date.now())/60000)):0;return `<div class="card load"><span class="badge kind ${l.kind==='آزاد'?'blue':'green'}">${l.kind}</span><h3>${l.origin} ← ${l.destination}</h3><div class="row"><span>بار</span><strong>${l.cargo}</strong></div><div class="row"><span>وزن</span><strong>${l.weight} تن</strong></div><div class="row"><span>اعلام‌کننده</span><strong>${l.owner}</strong></div>${l.kind==='نوبتی'?`<div class="row"><span>مهلت نوبت</span><strong>${remain} دقیقه</strong></div><div class="small">نوبتی: فقط راننده واجد شرایط در محدوده ۲۰۰ کیلومتر می‌تواند انتخاب کند.</div>`:'<div class="small">بار آزاد: محدودیت ۲۰۰ کیلومتر ندارد.</div>'}${chosen?'<button class="btn secondary" onclick="cancelLoad('+l.id+')">لغو انتخاب و برگشت ۱۰,۰۰۰ تومان</button>':`<button class="btn" onclick="chooseLoad(${l.id})">انتخاب بار · ${money(FEE)}</button>`}</div>`}).join('')}
function distance(a,b){let R=6371,p=Math.PI/180,la=(a[0]-b[0])*p,lo=(a[1]-b[1])*p,x=Math.sin(la/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(lo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function getDriverDistance(origin){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(p=>{let o=coords[origin];if(!o)return rej();res(distance([p.coords.latitude,p.coords.longitude],o))},()=>rej(),{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
async function chooseLoad(id){refreshKinds();let l=loads.find(x=>x.id===id);if(!l)return;if(selected.some(x=>x.id===id))return;if(l.kind==='نوبتی'){try{let d=await getDriverDistance(l.origin);if(d>RADIUS){openModal(`<h2>امکان انتخاب نوبتی نیست</h2><p>فاصله تقریبی شما تا ${l.origin}: <b>${d.toFixed(1)} کیلومتر</b></p><p>برای بار نوبتی حداکثر فاصله مجاز ۲۰۰ کیلومتر است.</p><button class="btn secondary" onclick="closeModal()">متوجه شدم</button>`);return}}catch(e){openModal(`<h2>نیاز به موقعیت مکانی</h2><p>برای انتخاب بار نوبتی، اجازه دسترسی به موقعیت مکانی لازم است.</p><p class="small">اگر بار آزاد باشد، GPS لازم نیست.</p><button class="btn secondary" onclick="closeModal()">بستن</button>`);return}}if(wallet<FEE){openModal(`<h2>موجودی کافی نیست</h2><p>موجودی: ${money(wallet)}</p><p>هزینه انتخاب: ${money(FEE)}</p><button class="btn" onclick="closeModal();show('more')">شارژ کیف پول</button>`);return}openModal(`<h2>تأیید انتخاب بار</h2><p>${l.origin} ← ${l.destination}</p><p>هزینه انتخاب: <b>${money(FEE)}</b></p><button class="btn" onclick="confirmChoose(${id})">تأیید و پرداخت</button><button class="btn secondary" onclick="closeModal()">انصراف</button>`)}
function confirmChoose(id){let l=loads.find(x=>x.id===id);if(!l)return;wallet-=FEE;selected.push({id:l.id,selectedAt:Date.now(),fee:FEE});tx.unshift({date:new Date().toLocaleString('fa-IR'),title:'هزینه انتخاب بار',amount:-FEE});save();closeModal();toast('بار با موفقیت انتخاب شد');renderLoads();renderMy()}
function cancelLoad(id){let i=selected.findIndex(x=>x.id===id);if(i<0)return;wallet+=FEE;selected.splice(i,1);tx.unshift({date:new Date().toLocaleString('fa-IR'),title:'بازگشت هزینه انتخاب بار',amount:FEE});save();toast('هزینه انتخاب برگشت داده شد');renderLoads();renderMy()}
function renderMy(){let b=document.getElementById('myBox');if(!selected.length){b.innerHTML='<div class="card empty">هنوز باری انتخاب نکرده‌اید.</div>';return}b.innerHTML=selected.map(s=>{let l=loads.find(x=>x.id===s.id);return l?`<div class="card"><h3>${l.origin} ← ${l.destination}</h3><div class="row"><span>بار</span><strong>${l.cargo}</strong></div><div class="row"><span>وزن</span><strong>${l.weight} تن</strong></div><span class="badge green">انتخاب شده</span><button class="btn secondary" onclick="cancelLoad(${l.id})">لغو و استرداد</button></div>`:''}).join('')}
function announceLoad(){let o=document.getElementById('origin').value.trim(),d=document.getElementById('destination').value.trim(),c=document.getElementById('cargo').value.trim(),w=+document.getElementById('weight').value,k=document.getElementById('kind').value,m=+document.getElementById('deadline').value;if(!o||!d||!c||!w){toast('اطلاعات بار را کامل کنید');return}let now=Date.now();loads.unshift({id:Date.now(),origin:o,destination:d,cargo:c,weight:w,kind:k,created:now,deadline:k==='نوبتی'?now+m*60000:now,owner:'کاربر آزمایشی'});save();toast('بار ثبت شد');document.getElementById('origin').value='';document.getElementById('destination').value='';document.getElementById('cargo').value='';document.getElementById('weight').value='';show('loads')}
function charge(){let n=prompt('مبلغ شارژ را به تومان وارد کنید','100000');n=+n;if(!n||n<1000)return;wallet+=n;tx.unshift({date:new Date().toLocaleString('fa-IR'),title:'شارژ کیف پول',amount:n});save();document.getElementById('wallet').textContent=money(wallet);toast('کیف پول شارژ شد')}
function transactions(){openModal('<h2>تراکنش‌ها</h2>'+ (tx.length?tx.slice(0,20).map(x=>`<div class="row"><span>${x.title}<br><small>${x.date}</small></span><strong>${x.amount>0?'+':''}${money(x.amount)}</strong></div>`).join('<div class="divider"></div>'):'<div class="empty">تراکنشی نیست</div>'))}
function profile(){openModal('<h2>پروفایل راننده</h2><div class="card"><div class="row"><span>نام</span><strong>محمد حسین رافعی</strong></div><div class="row"><span>شماره موبایل</span><strong>نسخه آزمایشی</strong></div><div class="row"><span>کارت هوشمند</span><strong>فعال</strong></div></div>')}
function truck(){openModal('<h2>اطلاعات کامیون</h2><div class="card"><div class="row"><span>خودرو</span><strong>Volvo FH500</strong></div><div class="row"><span>مدل</span><strong>2021</strong></div><div class="row"><span>کاربری</span><strong>کمپرسی</strong></div><div class="row"><span>پلاک</span><strong>47 ع 511 ایران 52</strong></div></div>')}
function openModal(x){document.getElementById('modalBody').innerHTML=x;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function resetDemo(){if(confirm('همه اطلاعات آزمایشی پاک شود؟')){localStorage.clear();location.reload()}}
renderStatus();renderLoads();setInterval(()=>{if(document.getElementById('loads').classList.contains('active'))renderLoads()},30000);
</script></body></html>
