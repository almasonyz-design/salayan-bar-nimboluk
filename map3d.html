<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b13"><title>GPS صلایان بار</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
:root{--bg:#071b13;--panel:#0d281d;--panel2:#123827;--line:#28523d;--green:#3de0a0;--white:#f3fff8;--muted:#a7c4b4;--gold:#ffcf70}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--white)}body{overflow-x:hidden}.shell{display:flex;flex-direction:column;min-height:100dvh;background:radial-gradient(ellipse at 80% 0,#164c34 0,transparent 38%),var(--bg)}.head{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;border-bottom:1px solid #ffffff14;background:#071b13}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#5dffc0,#0b9d69);font-size:23px}.title{font-weight:900;font-size:14px}.subtitle{font-size:10px;color:var(--muted);margin-top:3px}.status{font-size:10px;color:#c8ffe5;background:#123b29;border:1px solid #2b694b;border-radius:20px;padding:7px 9px;white-space:nowrap}.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:5px}main{flex:1;min-height:0;display:flex;flex-direction:column}.mapbox{position:relative;min-height:300px;height:52dvh;max-height:620px;background:#1a382a;flex:none}#map{position:absolute;inset:0;touch-action:pan-x pan-y}.maplibregl-canvas,.maplibregl-canvas-container{touch-action:pan-x pan-y!important}.maplibregl-ctrl-attrib{font-size:9px!important}.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}.maplibregl-ctrl-group button{width:34px;height:34px}.maptools{position:absolute;z-index:4;top:10px;left:10px;display:flex;flex-direction:column;gap:7px}.icbtn{width:42px;height:42px;border:1px solid #ffffff27;border-radius:14px;background:#092319eF;color:white;box-shadow:0 5px 18px #00180e4a;font-size:18px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.icbtn.active{background:#3de0a0;color:#062519;border-color:#8affd0}.searchpanel{position:absolute;z-index:4;top:10px;right:10px;left:62px;display:flex;gap:6px;padding:6px;background:#092319ee;border:1px solid #ffffff22;border-radius:15px;box-shadow:0 8px 24px #00180e4a}.searchpanel input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white;padding:7px 8px;font:13px Tahoma}.searchpanel input::placeholder{color:#a8c7b7}.go{border:0;border-radius:10px;padding:0 12px;background:var(--green);color:#042518;font-weight:900;white-space:nowrap}.sheet{padding:12px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#0a2117,#071b13);border-top:1px solid #ffffff14}.gpsrow{display:flex;align-items:center;gap:10px}.gpsdot{width:43px;height:43px;flex:none;border-radius:15px;background:#103e2a;color:var(--green);display:grid;place-items:center;font-size:22px}.gpstext{flex:1;min-width:0}.gpstext strong{display:block;font-size:13px}.gpstext small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.6}.speedbox{padding:7px 10px;border:1px solid var(--line);background:#0d2a1d;border-radius:13px;text-align:center;min-width:67px}.speedbox b{font-size:20px;color:var(--green)}.speedbox small{display:block;font-size:9px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.action{min-width:0;min-height:64px;border:1px solid #28543e;border-radius:14px;background:#0d2a1d;color:#ecfff4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:11px Tahoma;touch-action:manipulation}.action b{font-size:19px;color:var(--green)}.action.active{background:#144831;border-color:#42dca0}.routeinfo{display:none;border:1px solid #28543e;background:#0d2a1d;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.8}.routeinfo.show{display:block}.steps{max-height:160px;overflow:auto;color:#d7eade;font-size:11px;line-height:2}.toast{position:fixed;z-index:100;bottom:12px;left:12px;right:12px;margin:auto;max-width:460px;padding:12px 14px;border-radius:13px;background:#eafff3;color:#103725;box-shadow:0 8px 30px #0006;font-size:12px;display:none}.toast.show{display:block}.pin{width:38px;height:46px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 4px 5px #00150d99)}.pin:before{content:"";position:absolute;inset:3px 2px 7px;background:#0db77b;border:3px solid white;border-radius:13px 13px 13px 4px;transform:rotate(-45deg)}.pin span{position:relative;z-index:1;font-size:21px;filter:drop-shadow(0 1px 1px #00472b)}.footnote{color:#86a897;font-size:9px;text-align:center;line-height:1.7}
html.embed .head{display:none}html.embed .shell{min-height:0;height:auto}html.embed main{min-height:0}html.embed .mapbox{height:47dvh;min-height:290px;max-height:480px}html.embed .sheet{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}html.embed .footnote{display:none}
@media(min-width:760px){.shell{max-width:1200px;margin:auto}.mapbox{height:58dvh}.sheet{padding:16px 22px}.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:390px){.mapbox{height:48dvh;min-height:280px}.searchpanel{left:59px;right:7px;top:7px}.maptools{left:7px;top:7px}.icbtn{width:40px;height:40px}.go{padding:0 9px;font-size:11px}.actions{gap:5px}.action{font-size:10px;min-height:60px}.gpsdot{width:39px;height:39px}}
</style>
</head>
<body><div class="shell">
<header class="head"><div class="brand"><div class="logo">🚛</div><div><div class="title">صلایان بار <span style="color:#3de0a0">| GPS</span></div><div class="subtitle">مسیریابی هوشمند رانندگان</div></div></div><div class="status"><i class="led"></i><span id="status">در حال آماده‌سازی نقشه</span></div></header>
<main><section class="mapbox"><div id="map"></div>
<div class="searchpanel"><input id="destination" placeholder="مقصد را بنویس؛ مثلاً مشهد…" autocomplete="off"><button class="go" id="routeBtn">مسیریابی ←</button></div>
<div class="maptools"><button class="icbtn" id="locBtn" title="موقعیت من" aria-label="موقعیت من">⌖</button><button class="icbtn active" id="satBtn" title="نمای ماهواره‌ای" aria-label="نمای ماهواره‌ای">▧</button><button class="icbtn" id="tiltBtn" title="نمای سه‌بعدی" aria-label="نمای سه‌بعدی">3D</button><button class="icbtn" id="northBtn" title="جهت شمال" aria-label="جهت شمال">N</button><button class="icbtn" id="zoomIn" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی">＋</button><button class="icbtn" id="zoomOut" title="کوچک‌نمایی" aria-label="کوچک‌نمایی">−</button></div>
</section>
<section class="sheet"><div class="gpsrow"><div class="gpsdot">⌖</div><div class="gpstext"><strong id="routeTitle">در انتظار موقعیت گوشی</strong><small id="routeSub">GPS را روشن کن؛ موقعیت روی نقشه نمایش داده می‌شود.</small></div><div class="speedbox"><b id="speed">—</b><small>km/h</small></div></div>
<div class="actions"><button class="action" id="followBtn"><b>◎</b>دنبال‌کردن من</button><button class="action" id="voiceBtn"><b>◖))</b>راهنمای صوتی</button><button class="action" id="stepsBtn"><b>☷</b>جزئیات مسیر</button><button class="action" id="clearBtn"><b>↺</b>پاک‌کردن مسیر</button></div>
<div class="routeinfo" id="routeinfo"><div id="routeSummary"></div><div class="steps" id="steps"></div></div>
<div class="footnote">موقعیت دقیق به مجوز مکان‌یابی و GPS دستگاه وابسته است. نقشه برای حرکت با یک یا دو انگشت فعال است.</div></section></main></div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), embed=new URLSearchParams(location.search).has('embed');
if(embed)document.documentElement.classList.add('embed');
let map, marker=null, current=null, watchId=null, follow=true, satellite=true, tilted=false, routeLayer=false, voiceOn=false, routeSteps=[];
const roadStyle={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'},sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri'}},layers:[{id:'osm',type:'raster',source:'osm'},{id:'sat',type:'raster',source:'sat'}]};
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3500)}
function status(s){$('status').textContent=s}
function truckMarker(){const el=document.createElement('div');el.className='pin';el.innerHTML='<span>🚛</span>';return el}
function setPos(p){const xy=[p.coords.longitude,p.coords.latitude], first=!current;current=xy;if(!marker)marker=new maplibregl.Marker({element:truckMarker(),anchor:'bottom'}).setLngLat(xy).addTo(map);else marker.setLngLat(xy);$('speed').textContent=p.coords.speed==null?'—':Math.round(Math.max(0,p.coords.speed*3.6));$('routeTitle').textContent='موقعیت شما روی نقشه ثبت شد';$('routeSub').textContent='دقت حدود '+Math.round(p.coords.accuracy)+' متر · GPS فعال';status('GPS متصل');try{localStorage.setItem('salayan_lat',xy[1]);localStorage.setItem('salayan_lng',xy[0]);localStorage.setItem('salayan_accuracy',p.coords.accuracy||0)}catch(e){}if(follow&&(first||map.getZoom()<14))map.easeTo({center:xy,zoom:15.5,duration:first?700:350});}
function gps(){if(!navigator.geolocation){toast('این مرورگر از مکان‌یابی پشتیبانی نمی‌کند');return}status('در حال دریافت موقعیت…');$('routeSub').textContent='در حال اتصال به GPS گوشی…';navigator.geolocation.getCurrentPosition(p=>setPos(p),e=>{status('GPS در دسترس نیست');const msg=e.code===1?'مجوز مکان‌یابی را برای مرورگر فعال کن.':'موقعیت دریافت نشد؛ GPS و اینترنت گوشی را بررسی کن.';$('routeSub').textContent=msg;toast(msg)},{enableHighAccuracy:true,timeout:18000,maximumAge:0});if(watchId===null)watchId=navigator.geolocation.watchPosition(setPos,e=>{if(e.code===1)status('مجوز GPS غیرفعال است')},{enableHighAccuracy:true,timeout:20000,maximumAge:4000})}
function setSatellite(on){satellite=on;map.setLayoutProperty('sat','visibility',on?'visible':'none');map.setLayoutProperty('osm','visibility',on?'none':'visible');$('satBtn').classList.toggle('active',on);$('satBtn').title=on?'نمای ماهواره‌ای فعال':'نمای جاده‌ای'}
function setTilt(on){tilted=on;map.easeTo({pitch:on?55:0,bearing:on?-12:0,duration:500});$('tiltBtn').classList.toggle('active',on);$('tiltBtn').textContent=on?'3D ✓':'3D'}
async function route(){const q=$('destination').value.trim();if(!q){toast('اول نام مقصد را وارد کن');$('destination').focus();return}status('در حال جستجوی مقصد…');try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);const res=await fetch(url,{headers:{'Accept-Language':'fa'} });if(!res.ok)throw Error('جستجوی مقصد ناموفق بود');const places=await res.json();if(!places.length)throw Error('مقصد پیدا نشد؛ نام شهر یا روستا را دقیق‌تر بنویس');const dest=[Number(places[0].lon),Number(places[0].lat)];if(!current){map.flyTo({center:dest,zoom:12,duration:900});$('routeTitle').textContent=places[0].display_name.split(',').slice(0,2).join('،');$('routeSub').textContent='برای محاسبه مسیر، ابتدا موقعیت فعلی را مشخص کن.';status('مقصد روی نقشه است');return}status('در حال محاسبه مسیر جاده‌ای…');const rr=await fetch('https://router.project-osrm.org/route/v1/driving/'+current.join(',')+';'+dest.join(',')+'?overview=full&geometries=geojson&steps=true');if(!rr.ok)throw Error('سرویس مسیر‌یابی پاسخ نداد');const data=await rr.json();if(data.code!=='Ok'||!data.routes.length)throw Error('مسیر جاده‌ای برای این مقصد پیدا نشد');const r=data.routes[0];if(map.getSource('route')){map.getSource('route').setData({type:'Feature',properties:{},geometry:r.geometry})}else{map.addSource('route',{type:'geojson',data:{type:'Feature',properties:{},geometry:r.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#21d995','line-width':6,'line-opacity':.95,'line-outline-color':'#073b29'}})}routeLayer=true;routeSteps=r.legs.flatMap(l=>l.steps||[]);const coords=r.geometry.coordinates;const bounds=coords.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(coords[0],coords[0]));map.fitBounds(bounds,{padding:{top:75,bottom:60,left:55,right:55},duration:900});const km=(r.distance/1000).toFixed(1),min=Math.round(r.duration/60);$('routeSummary').textContent='مسافت '+km+' کیلومتر · زمان تقریبی '+(min>=60?Math.floor(min/60)+' ساعت و '+min%60+' دقیقه':min+' دقیقه');$('steps').innerHTML=routeSteps.slice(0,25).map((s,i)=>'<div>'+(i+1)+'. '+(s.name||s.maneuver?.type||'ادامه مسیر')+' — '+(s.distance>1000?(s.distance/1000).toFixed(1)+' کیلومتر':Math.round(s.distance)+' متر')+'</div>').join('');$('routeinfo').classList.add('show');$('routeTitle').textContent='مسیر جاده‌ای آماده است';$('routeSub').textContent=places[0].display_name.split(',').slice(0,3).join('،');status('مسیریابی انجام شد');}catch(e){status('مسیریابی ناموفق');toast(e.message||'اتصال اینترنت را بررسی کن')}}
function clearRoute(){if(map.getLayer('route-line'))map.removeLayer('route-line');if(map.getSource('route'))map.removeSource('route');routeLayer=false;$('routeinfo').classList.remove('show');$('routeTitle').textContent=current?'موقعیت شما روی نقشه ثبت شد':'در انتظار موقعیت گوشی';$('routeSub').textContent='مقصدی وارد کن تا مسیر جاده‌ای محاسبه شود.';status(current?'GPS متصل':'آماده')}
$('locBtn').addEventListener('click',()=>{follow=true;$('followBtn').classList.add('active');gps()});
$('followBtn').addEventListener('click',()=>{follow=!follow;$('followBtn').classList.toggle('active',follow);if(follow&&current)map.easeTo({center:current,zoom:Math.max(15,map.getZoom()),duration:500});toast(follow?'دنبال‌کردن موقعیت روشن شد':'نقشه آزاد است؛ می‌توانی جابه‌جایش کنی')});
$('satBtn').addEventListener('click',()=>setSatellite(!satellite));$('tiltBtn').addEventListener('click',()=>setTilt(!tilted));$('northBtn').addEventListener('click',()=>map.easeTo({bearing:0,pitch:0,duration:500}));$('zoomIn').addEventListener('click',()=>map.zoomTo(map.getZoom()+1,{duration:250}));$('zoomOut').addEventListener('click',()=>map.zoomTo(map.getZoom()-1,{duration:250}));$('routeBtn').addEventListener('click',route);$('destination').addEventListener('keydown',e=>{if(e.key==='Enter')route()});$('stepsBtn').addEventListener('click',()=>{if(!routeLayer){toast('ابتدا مقصد را وارد و مسیریابی کن');return}$('routeinfo').classList.toggle('show')});$('clearBtn').addEventListener('click',clearRoute);$('voiceBtn').addEventListener('click',()=>{voiceOn=!voiceOn;$('voiceBtn').classList.toggle('active',voiceOn);toast(voiceOn?'راهنمای صوتی آزمایشی روشن شد':'راهنمای صوتی خاموش شد')});
try{let center=[58.97,33.94];const lo=localStorage.getItem('salayan_lng'),la=localStorage.getItem('salayan_lat');if(lo&&la&&Number.isFinite(+lo)&&Number.isFinite(+la))center=[+lo,+la];map=new maplibregl.Map({container:'map',style:roadStyle,center,zoom:lo?14:7.5,pitch:0,bearing:0,attributionControl:false,dragPan:true,scrollZoom:true,touchZoomRotate:true,doubleClickZoom:true,cooperativeGestures:false});map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:false}),'bottom-right');map.on('load',()=>{setSatellite(true);status('نقشه آماده است');gps();setTimeout(()=>map.resize(),150);});map.on('error',()=>status('در حال بارگذاری نقشه…'));window.addEventListener('resize',()=>map.resize());}catch(e){status('نقشه بارگذاری نشد');toast('اینترنت را بررسی و دوباره تلاش کن')}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='salayan-start-gps'||e.data?.type==='salayan-map-refresh')gps()});
})();
</script></body></html>
