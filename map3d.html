<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f6"><title>مسیریاب صلایان بار</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
:root{--ink:#14251e;--muted:#72857b;--green:#087f55;--mint:#dff8ec;--line:#e1eae5;--glass:rgba(255,255,255,.94);--shadow:0 10px 34px rgba(14,45,30,.15)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#edf3ef;color:var(--ink)}body{overflow:hidden}.shell{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:#e8efea}.head{position:absolute;z-index:5;top:10px;right:12px;left:12px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.brand,.status{pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 14px}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#13a76f,#06613f);display:grid;place-items:center;color:white;font-size:20px}.title{font-size:12px;font-weight:900;letter-spacing:-.2px}.subtitle{font-size:9px;color:var(--muted);margin-top:3px}.status{display:flex;align-items:center;gap:6px;padding:9px 11px;font-size:10px;color:#315d48;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.led{width:7px;height:7px;border-radius:50%;background:#12b981;flex:none;box-shadow:0 0 0 4px #12b98120}main,.mapbox,#map{position:absolute;inset:0;width:100%;height:100%}.mapbox{background:#dce8df}#map{touch-action:pan-x pan-y}.maplibregl-canvas,.maplibregl-canvas-container{touch-action:pan-x pan-y!important}.maplibregl-ctrl-attrib{font-size:9px!important;background:#ffffffcf!important;border-radius:7px 0 0 0!important}.maplibregl-ctrl-bottom-right{bottom:175px!important;right:8px!important}.maplibregl-ctrl-group{border-radius:14px!important;overflow:hidden;box-shadow:0 4px 18px #1234!important}.maplibregl-ctrl-group button{width:34px;height:34px}.searchpanel{position:absolute;z-index:4;top:72px;left:12px;right:12px;display:flex;align-items:center;gap:9px;padding:8px 9px 8px 8px;border:1px solid #ffffff;background:var(--glass);backdrop-filter:blur(18px);border-radius:21px;box-shadow:var(--shadow)}.searchicon{width:39px;height:39px;flex:none;border-radius:14px;display:grid;place-items:center;background:#e3f6ec;color:var(--green);font-size:20px}.searchpanel input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);padding:8px 2px;font:13px Tahoma}.searchpanel input::placeholder{color:#89988f}.go{border:0;border-radius:14px;padding:0 15px;height:40px;background:linear-gradient(135deg,#0a9a66,#08734c);color:#fff;font: bold 11px Tahoma;white-space:nowrap;box-shadow:0 4px 10px #087f5525}.maptools{position:absolute;z-index:4;top:132px;left:12px;display:flex;flex-direction:column;gap:8px}.icbtn{width:43px;height:43px;border:1px solid #ffffff;background:var(--glass);backdrop-filter:blur(14px);color:#315545;border-radius:16px;box-shadow:0 5px 18px #1232;font-size:18px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:transform .15s,background .15s}.icbtn:active,.action:active{transform:scale(.94)}.icbtn.active{background:#087f55;color:white;border-color:#087f55}.icbtn .smalltag{font-size:11px;font-weight:900}.sheet{position:absolute;z-index:5;bottom:0;right:0;left:0;padding:11px 13px calc(12px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:rgba(250,253,251,.97);backdrop-filter:blur(22px);box-shadow:0 -8px 35px #102e1d18;border-top:1px solid #fff}.grab{width:36px;height:4px;background:#d4dfd8;border-radius:9px;margin:0 auto 12px}.gpsrow{display:flex;align-items:center;gap:10px;padding:0 2px 12px}.gpsdot{width:43px;height:43px;flex:none;border-radius:16px;background:#e0f7eb;color:var(--green);display:grid;place-items:center;font-size:22px}.gpstext{flex:1;min-width:0}.gpstext strong{display:block;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gpstext small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.7}.speedbox{padding:7px 11px;border:1px solid #d9ece1;background:#f0faf5;border-radius:15px;text-align:center;min-width:66px}.speedbox b{font-size:19px;color:var(--green)}.speedbox small{display:block;font-size:9px;color:var(--muted);margin-top:1px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.action{min-width:0;min-height:65px;border:1px solid #e2ece6;border-radius:18px;background:#fff;color:#486356;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:10px Tahoma;touch-action:manipulation;box-shadow:0 3px 10px #173b2610}.action b{width:27px;height:27px;border-radius:10px;background:#eef8f2;color:var(--green);font-size:18px;display:grid;place-items:center}.action.active{background:#e3f8ed;border-color:#9bdcba;color:#075d3d}.action.active b{background:#0b8b5d;color:white}.routeinfo{display:none;margin-top:9px;border:1px solid #dce9e1;background:#f3faf6;border-radius:16px;padding:10px 12px;font-size:11px;line-height:1.9}.routeinfo.show{display:block}.steps{max-height:115px;overflow:auto;color:#486356;font-size:10px;line-height:2.1}.toast{position:absolute;z-index:20;top:124px;left:65px;right:65px;margin:auto;max-width:400px;padding:12px 14px;border-radius:15px;background:#173a2b;color:white;box-shadow:var(--shadow);font-size:11px;text-align:center;display:none}.toast.show{display:block}.pin{width:46px;height:51px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 5px 7px #00281750)}.pin:before{content:"";position:absolute;inset:3px 2px 8px;background:linear-gradient(145deg,#17b77b,#08734c);border:3px solid white;border-radius:17px 17px 17px 5px;transform:rotate(-45deg);box-shadow:0 0 0 1px #087f5540}.pin span{position:relative;z-index:1;font-size:22px}.footnote{color:#87968d;font-size:9px;text-align:center;line-height:1.6;margin-top:8px}
html.embed .head{top:8px;right:8px;left:8px;height:43px}html.embed .logo{width:29px;height:29px;font-size:17px;border-radius:10px}html.embed .brand{padding:5px 9px;gap:7px;border-radius:15px}html.embed .title{font-size:10px}html.embed .subtitle{font-size:8px}html.embed .status{font-size:9px;padding:7px 9px}html.embed .searchpanel{top:59px;left:8px;right:8px;padding:6px;border-radius:17px;gap:6px}html.embed .searchicon{width:32px;height:32px;border-radius:11px;font-size:17px}html.embed .searchpanel input{font-size:11px}html.embed .go{height:34px;border-radius:11px;padding:0 10px;font-size:10px}html.embed .maptools{top:111px;left:8px;gap:6px}html.embed .icbtn{width:35px;height:35px;border-radius:13px;font-size:15px}html.embed .sheet{padding:8px 9px calc(9px + env(safe-area-inset-bottom));border-radius:21px 21px 0 0}html.embed .grab{margin-bottom:8px}html.embed .gpsrow{gap:8px;padding-bottom:8px}html.embed .gpsdot{width:35px;height:35px;border-radius:13px;font-size:18px}html.embed .gpstext strong{font-size:10px}html.embed .gpstext small{font-size:9px;margin-top:3px}html.embed .speedbox{min-width:54px;padding:5px 7px;border-radius:12px}html.embed .speedbox b{font-size:16px}html.embed .actions{gap:5px}html.embed .action{min-height:51px;border-radius:14px;font-size:9px;gap:3px}html.embed .action b{width:22px;height:22px;border-radius:8px;font-size:15px}html.embed .footnote{display:none}html.embed .routeinfo{margin-top:6px;padding:7px 9px;font-size:10px}html.embed .steps{max-height:70px}html.embed .maplibregl-ctrl-bottom-right{bottom:148px!important;right:5px!important}
@media(max-width:390px){.head{top:7px;right:7px;left:7px}.brand{padding:5px 8px}.subtitle{display:none}.status{font-size:9px;padding:8px}.searchpanel{top:65px;left:7px;right:7px}.maptools{top:119px;left:7px}.icbtn{width:39px;height:39px}.go{padding:0 10px;font-size:10px}.sheet{padding-left:9px;padding-right:9px}.action{font-size:9px}.maplibregl-ctrl-bottom-right{bottom:185px!important}}
@media(min-width:700px){.shell{max-width:1100px;margin:auto}.sheet{left:0;right:0;max-width:700px;margin:auto;border-radius:25px 25px 0 0}.searchpanel{max-width:650px;left:50%;right:auto;width:calc(100% - 120px);transform:translateX(50%)}.maptools{left:calc(50% - 520px)}}
</style>
</head>
<body><div class="shell">
<header class="head"><div class="brand"><div class="logo">🚛</div><div><div class="title">صلایان بار <span style="color:#087f55">· مسیریاب</span></div><div class="subtitle">همراه هوشمند راننده</div></div></div><div class="status"><i class="led"></i><span id="status">در حال آماده‌سازی نقشه</span></div></header>
<main><section class="mapbox"><div id="map"></div>
<div class="searchpanel"><div class="searchicon">⌕</div><input id="destination" placeholder="مقصد کجاست؟ نام شهر یا روستا…" autocomplete="off"><button class="go" id="routeBtn">مسیریابی ←</button></div>
<div class="maptools"><button class="icbtn" id="locBtn" title="موقعیت من" aria-label="موقعیت من">⌖</button><button class="icbtn active" id="satBtn" title="نمای ماهواره‌ای" aria-label="نمای ماهواره‌ای">▧</button><button class="icbtn" id="tiltBtn" title="نمای سه‌بعدی" aria-label="نمای سه‌بعدی">3D</button><button class="icbtn" id="northBtn" title="شمال بالا" aria-label="شمال بالا">N</button><button class="icbtn" id="zoomIn" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی">＋</button><button class="icbtn" id="zoomOut" title="کوچک‌نمایی" aria-label="کوچک‌نمایی">−</button></div>
</section>
<section class="sheet"><div class="grab"></div><div class="gpsrow"><div class="gpsdot">⌖</div><div class="gpstext"><strong id="routeTitle">در انتظار موقعیت گوشی</strong><small id="routeSub">برای نمایش موقعیت دقیق، دسترسی GPS را فعال کن.</small></div><div class="speedbox"><b id="speed">—</b><small>km/h</small></div></div>
<div class="actions"><button class="action active" id="followBtn"><b>◎</b>موقعیت من</button><button class="action" id="voiceBtn"><b>◖))</b>راهنمای صوتی</button><button class="action" id="stepsBtn"><b>☷</b>جزئیات مسیر</button><button class="action" id="clearBtn"><b>↺</b>پاک‌کردن مسیر</button></div>
<div class="routeinfo" id="routeinfo"><div id="routeSummary"></div><div class="steps" id="steps"></div></div><div class="footnote">مسیریابی نیازمند اینترنت و مجوز مکان‌یابی گوشی است.</div></section></main></div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>(function(){
'use strict';
const $=id=>document.getElementById(id), embed=new URLSearchParams(location.search).has('embed');
if(embed)document.documentElement.classList.add('embed');
let map, marker=null, current=null, watchId=null, follow=true, satellite=true, tilted=false, routeLayer=false, voiceOn=false, routeSteps=[];
const roadStyle={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'},sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri'}},layers:[{id:'osm',type:'raster',source:'osm'},{id:'sat',type:'raster',source:'sat'}]};
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3500)}
function status(s){$('status').textContent=s}
function truckMarker(){const el=document.createElement('div');el.className='pin';el.innerHTML='<span>🚛</span>';return el}
function setPos(p){const xy=[p.coords.longitude,p.coords.latitude], first=!current;current=xy;if(!marker)marker=new maplibregl.Marker({element:truckMarker(),anchor:'bottom'}).setLngLat(xy).addTo(map);else marker.setLngLat(xy);$('speed').textContent=p.coords.speed==null?'—':Math.round(Math.max(0,p.coords.speed*3.6));$('routeTitle').textContent='موقعیت شما روی نقشه ثبت شد';$('routeSub').textContent='دقت حدود '+Math.round(p.coords.accuracy)+' متر · GPS فعال';status('GPS متصل');try{localStorage.setItem('salayan_lat',xy[1]);localStorage.setItem('salayan_lng',xy[0]);localStorage.setItem('salayan_accuracy',p.coords.accuracy||0)}catch(e){}if(follow&&(first||map.getZoom()<14))map.easeTo({center:xy,zoom:15.5,duration:first?700:350});}
function gps(){if(!navigator.geolocation){toast('این مرورگر از مکان‌یابی پشتیبانی نمی‌کند');return}status('در حال دریافت موقعیت…');$('routeSub').textContent='در حال اتصال به GPS گوشی…';navigator.geolocation.getCurrentPosition(p=>setPos(p),e=>{status('GPS در دسترس نیست');const msg=e.code===1?'مجوز مکان‌یابی را برای مرورگر فعال کن.':'موقعیت دریافت نشد؛ GPS و اینترنت گوشی را بررسی کن.';$('routeSub').textContent=msg;toast(msg)},{enableHighAccuracy:true,timeout:18000,maximumAge:0});if(watchId===null)watchId=navigator.geolocation.watchPosition(setPos,e=>{if(e.code===1)status('مجوز GPS غیرفعال است')},{enableHighAccuracy:true,timeout:20000,maximumAge:4000})}
function setSatellite(on){satellite=on;map.setLayoutProperty('sat','visibility',on?'visible':'none');map.setLayoutProperty('osm','visibility',on?'none':'visible');$('satBtn').classList.toggle('active',on);$('satBtn').title=on?'نمای ماهواره‌ای فعال':'نمای جاده‌ای'}
function setTilt(on){tilted=on;map.easeTo({pitch:on?55:0,bearing:on?-12:0,duration:500});$('tiltBtn').classList.toggle('active',on);$('tiltBtn').textContent=on?'3D ✓':'3D'}
async function route(){const q=$('destination').value.trim();if(!q){toast('اول نام مقصد را وارد کن');$('destination').focus();return}status('در حال جستجوی مقصد…');try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);const res=await fetch(url,{headers:{'Accept-Language':'fa'} });if(!res.ok)throw Error('جستجوی مقصد ناموفق بود');const places=await res.json();if(!places.length)throw Error('مقصد پیدا نشد؛ نام شهر یا روستا را دقیق‌تر بنویس');const dest=[Number(places[0].lon),Number(places[0].lat)];if(!current){map.flyTo({center:dest,zoom:12,duration:900});$('routeTitle').textContent=places[0].display_name.split(',').slice(0,2).join('،');$('routeSub').textContent='برای محاسبه مسیر، ابتدا موقعیت فعلی را مشخص کن.';status('مقصد روی نقشه است');return}status('در حال محاسبه مسیر جاده‌ای…');const rr=await fetch('https://router.project-osrm.org/route/v1/driving/'+current.join(',')+';'+dest.join(',')+'?overview=full&geometries=geojson&steps=true');if(!rr.ok)throw Error('سرویس مسیر‌یابی پاسخ نداد');const data=await rr.json();if(data.code!=='Ok'||!data.routes.length)throw Error('مسیر جاده‌ای برای این مقصد پیدا نشد');const r=data.routes[0];if(map.getSource('route')){map.getSource('route').setData({type:'Feature',properties:{},geometry:r.geometry})}else{map.addSource('route',{type:'geojson',data:{type:'Feature',properties:{},geometry:r.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#21d995','line-width':6,'line-opacity':.95,'line-outline-color':'#073b29'}})}routeLayer=true;routeSteps=r.legs.flatMap(l=>l.steps||[]);const coords=r.geometry.coordinates;const bounds=coords.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(coords[0],coords[0]));map.fitBounds(bounds,{padding:{top:75,bottom:60,left:55,right:55},duration:900});const km=(r.distance/1000).toFixed(1),min=Math.round(r.duration/60);$('routeSummary').textContent='مسافت '+km+' کیلومتر · زمان تقریبی '+(min>=60?Math.floor(min/60)+' ساعت و '+min%60+' دقیقه':min+' دقیقه');$('steps').innerHTML=routeSteps.slice(0,25).map((s,i)=>'<div>'+(i+1)+'. '+(s.name||s.maneuver?.type||'ادامه مسیر')+' — '+(s.distance>1000?(s.distance/1000).toFixed(1)+' کیلومتر':Math.round(s.distance)+' متر')+'</div>').join('');$('routeinfo').classList.add('show');$('routeTitle').textContent='مسیر جاده‌ای آماده است';$('routeSub').textContent=places[0].display_name.split(',').slice(0,3).join('،');status('مسیریابی انجام شد');}catch(e){status('مسیریابی ناموفق');toast(e.message||'اتصال اینترنت را بررسی کن')}}
function clearRoute(){if(map.getLayer('route-line'))map.removeLayer('route-line');if(map.getSource('route'))map.removeSource('route');routeLayer=false;$('routeinfo').classList.remove('show');$('routeTitle').textContent=current?'موقعیت شما روی نقشه ثبت شد':'در انتظار موقعیت گوشی';$('routeSub').textContent='مقصدی وارد کن تا مسیر جاده‌ای محاسبه شود.';status(current?'GPS متصل':'آماده')}
$('locBtn').addEventListener('click',()=>{follow=true;$('followBtn').classList.add('active');gps()});
$('followBtn').addEventListener('click',()=>{follow=!follow;$('followBtn').classList.toggle('active',follow);if(follow&&current)map.easeTo({center:current,zoom:Math.max(15,map.getZoom()),duration:500});toast(follow?'دنبال‌کردن موقعیت روشن شد':'نقشه آزاد است؛ می‌توانی جابه‌جایش کنی')});
$('satBtn').addEventListener('click',()=>setSatellite(!satellite));$('tiltBtn').addEventListener('click',()=>setTilt(!tilted));$('northBtn').addEventListener('click',()=>map.easeTo({bearing:0,pitch:0,duration:500}));$('zoomIn').addEventListener('click',()=>map.zoomTo(map.getZoom()+1,{duration:250}));$('zoomOut').addEventListener('click',()=>map.zoomTo(map.getZoom()-1,{duration:250}));$('routeBtn').addEventListener('click',route);$('destination').addEventListener('keydown',e=>{if(e.key==='Enter')route()});$('stepsBtn').addEventListener('click',()=>{if(!routeLayer){toast('ابتدا مقصد را وارد و مسیریابی کن');return}$('routeinfo').classList.toggle('show')});$('clearBtn').addEventListener('click',clearRoute);$('voiceBtn').addEventListener('click',()=>{voiceOn=!voiceOn;$('voiceBtn').classList.toggle('active',voiceOn);if(voiceOn){const text=routeSteps.slice(0,12).map((s,i)=>(i+1)+'. '+(s.name||s.maneuver?.type||'ادامه مسیر')).join('. ');if(!routeSteps.length){voiceOn=false;$('voiceBtn').classList.remove('active');toast('ابتدا مقصد را وارد و مسیریابی کن');return}if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fa-IR';u.rate=.92;speechSynthesis.speak(u);toast('راهنمای صوتی مسیر پخش می‌شود')}else{voiceOn=false;$('voiceBtn').classList.remove('active');toast('مرورگر از راهنمای صوتی پشتیبانی نمی‌کند')}}else{if('speechSynthesis' in window)speechSynthesis.cancel();toast('راهنمای صوتی خاموش شد')}});
try{let center=[58.97,33.94];const lo=localStorage.getItem('salayan_lng'),la=localStorage.getItem('salayan_lat');if(lo&&la&&Number.isFinite(+lo)&&Number.isFinite(+la))center=[+lo,+la];map=new maplibregl.Map({container:'map',style:roadStyle,center,zoom:lo?14:7.5,pitch:0,bearing:0,attributionControl:false,dragPan:true,scrollZoom:true,touchZoomRotate:true,doubleClickZoom:true,cooperativeGestures:false});map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:false}),'bottom-right');map.on('load',()=>{setSatellite(true);status('نقشه آماده است');gps();setTimeout(()=>map.resize(),150);});map.on('error',()=>status('در حال بارگذاری نقشه…'));window.addEventListener('resize',()=>map.resize());}catch(e){status('نقشه بارگذاری نشد');toast('اینترنت را بررسی و دوباره تلاش کن')}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='salayan-start-gps'||e.data?.type==='salayan-map-refresh')gps()});
})();</script></body></html>
