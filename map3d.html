<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071812">
<title>نقشه صلایان بار</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css'">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071812;color:#f3fff8;font-family:Tahoma,Arial,sans-serif}body{overflow:auto}.app{width:100%;min-height:100dvh;background:#071812}#map{height:clamp(340px,54vh,540px);width:100%;background:#dbe8df;touch-action:pan-x pan-y}.maplibregl-canvas-container,.maplibregl-canvas-container canvas{touch-action:pan-x pan-y!important}.bar{display:flex;gap:10px;padding:12px;background:#071812}.bar button{flex:1;min-width:0;min-height:48px;border-radius:14px;border:1px solid #2b7654;background:#103b29;color:#edfff5;font-size:14px;font-weight:700}.bar .back{background:#172a21;border-color:#51685b}.status{padding:0 13px 12px;font-size:11px;line-height:1.8;color:#b8d6c5}.toast{position:fixed;z-index:20;top:12px;left:12px;right:12px;margin:auto;max-width:440px;padding:12px 14px;border-radius:13px;background:#0b2c20;border:1px solid #4d9a70;color:#fff;text-align:center;font-size:12px;display:none}.toast.show{display:block}.guide{position:fixed;inset:0;z-index:30;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.guide.open{display:flex}.guidebox{width:min(440px,100%);border-radius:20px;background:#0b2118;border:1px solid #367b55;padding:20px;box-shadow:0 20px 60px #0008}.guidebox h2{font-size:18px;margin:0 0 12px}.guidebox p{font-size:13px;line-height:2;color:#d2e8db;margin:0 0 14px}.guidebox button{width:100%;height:46px;border:0;border-radius:12px;background:#35d99a;color:#052c1d;font-weight:800;font-size:14px}
html:not(.sbl-embed-mode) .app{max-width:1100px;margin:auto}
@media(max-width:520px){#map{height:52vh;min-height:340px;max-height:470px}.bar{padding:10px;gap:8px}.bar button{font-size:13px;min-height:46px}}
</style>
</head>
<body>
<div class="app">
<div id="map" role="application" aria-label="نقشه ماهواره‌ای؛ برای حرکت نقشه را لمس کنید"></div>
<div class="bar">
<button id="guideBtn" type="button">راهنما</button>
<button id="backBtn" class="back" type="button">↩ بازگشت</button>
</div>
<div id="status" class="status">در حال آماده‌سازی نقشه…</div>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="guide" class="guide" aria-hidden="true"><div class="guidebox"><h2>راهنمای نقشه</h2><p>• برای حرکت، نقشه را با یک انگشت جابه‌جا کنید.<br>• برای بزرگ‌نمایی، دو انگشت را باز و بسته کنید.<br>• برای رفتن به موقعیت فعلی، اجازهٔ مکان‌یابی گوشی را فعال کنید.<br>• اگر مکان‌یابی را نپذیرید، نقشه در محدودهٔ نیمبلوک باز می‌شود.</p><button id="guideClose" type="button">متوجه شدم</button></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let map=null,marker=null,watchId=null,locating=false;
const fallback=[59.184,33.726];
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3200)}
function setStatus(msg){$('status').textContent=msg}
function truckElement(){const el=document.createElement('div');el.style.cssText='width:46px;height:46px;border:3px solid white;border-radius:15px;background:linear-gradient(145deg,#c8ffe3,#25cf8d);box-shadow:0 3px 18px #0008;display:grid;place-items:center;font-size:27px';el.textContent='🚛';return el}
function showPosition(pos){
 const lat=pos.coords.latitude,lon=pos.coords.longitude;
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 const ll=[lon,lat];
 if(!marker)marker=new maplibregl.Marker({element:truckElement(),anchor:'center'}).setLngLat(ll).addTo(map);else marker.setLngLat(ll);
 if(!locating){locating=true;map.flyTo({center:ll,zoom:16,duration:250});}
 else if(map.getZoom()<14)map.easeTo({center:ll,zoom:15,duration:250});
 localStorage.setItem('salayanGpsLast',JSON.stringify({lat:lat,lon:lon}));
 setStatus('موقعیت فعلی شما روی نقشه مشخص شد.');
}
function locate(){
 if(!navigator.geolocation){setStatus('این مرورگر مکان‌یابی را پشتیبانی نمی‌کند.');return}
 setStatus('در حال دریافت موقعیت فعلی…');
 navigator.geolocation.getCurrentPosition(pos=>showPosition(pos),err=>{
   setStatus(err.code===1?'اجازهٔ مکان‌یابی داده نشد؛ نقشهٔ نیمبلوک نمایش داده می‌شود.':'موقعیت دریافت نشد؛ نقشهٔ نیمبلوک نمایش داده می‌شود.');
 },{enableHighAccuracy:true,timeout:12000,maximumAge:5000});
 try{if(watchId===null)watchId=navigator.geolocation.watchPosition(showPosition,()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:20000})}catch(e){}
}
function initMap(){
 if(!window.maplibregl){setStatus('کتابخانهٔ نقشه بارگذاری نشد؛ اتصال اینترنت را بررسی و صفحه را دوباره باز کنید.');return}
 let center=fallback,zoom=11;
 try{const saved=JSON.parse(localStorage.getItem('salayanGpsLast')||'null');if(saved&&Number.isFinite(saved.lat)&&Number.isFinite(saved.lon)){center=[saved.lon,saved.lat];zoom=14}}catch(e){}
 try{
 map=new maplibregl.Map({container:'map',style:{version:8,sources:{
 'streets':{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'},
 'imagery':{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri'}
 },layers:[
 {id:'streets-layer',type:'raster',source:'streets',paint:{'raster-opacity':1}},
 {id:'imagery-layer',type:'raster',source:'imagery',paint:{'raster-opacity':1,'raster-fade-duration':0}}
 ]},center:center,zoom:zoom,attributionControl:true,logoPosition:'bottom-left',maxZoom:19});
 map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:true}),'top-left');
 map.on('load',()=>{map.resize();setStatus('نقشه آماده است؛ در حال پیدا کردن موقعیت شما…');locate();setTimeout(()=>map&&map.resize(),250)});
 map.on('error',e=>{if(e&&e.error)console.warn('Map tile error',e.error)});
 window.addEventListener('resize',()=>map&&map.resize(),{passive:true});
 setTimeout(()=>{if(map){map.resize();locate()}},700);
 }catch(e){console.error(e);setStatus('نقشه ساخته نشد؛ لطفاً صفحه را دوباره باز کنید.')}
}
function loadMapLib(){
 if(window.maplibregl){initMap();return}
 const script=document.createElement('script');script.src='https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js';
 script.onload=initMap;script.onerror=()=>{const fallbackScript=document.createElement('script');fallbackScript.src='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js';fallbackScript.onload=initMap;fallbackScript.onerror=()=>setStatus('کتابخانهٔ نقشه بارگذاری نشد؛ اینترنت را بررسی کنید.');document.head.appendChild(fallbackScript)};document.head.appendChild(script);
}
$('guideBtn').addEventListener('click',()=>{$('guide').classList.add('open');$('guide').setAttribute('aria-hidden','false')});
$('guideClose').addEventListener('click',()=>{$('guide').classList.remove('open');$('guide').setAttribute('aria-hidden','true')});
$('guide').addEventListener('click',e=>{if(e.target===$('guide')){$('guide').classList.remove('open');$('guide').setAttribute('aria-hidden','true')}});
$('backBtn').addEventListener('click',()=>{if(window.parent&&window.parent!==window){window.parent.postMessage('salayan-map-back','*')}else if(history.length>1){history.back()}else{location.href='./'}});
window.addEventListener('message',e=>{if(e.data==='salayan-start-gps')locate()});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadMapLib,{once:true});else loadMapLib();
})();
</script>
</body>
</html>
