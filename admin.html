<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت صلایان بار</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f3f6f8;
    color: #222;
}

header {
    background: #087f5b;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin: 7px 0 0;
    font-size: 13px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.stat {
    background: white;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.stat strong {
    display: block;
    font-size: 28px;
    color: #087f5b;
    margin-top: 8px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.menu button {
    border: none;
    background: white;
    padding: 18px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.menu button:hover {
    background: #eaf7f2;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.panel-title h2 {
    margin: 0;
    font-size: 19px;
}

button {
    font-family: inherit;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
}

.btn-primary {
    background: #087f5b;
    color: white;
}

.btn-secondary {
    background: #e9ecef;
    color: #222;
}

.btn-danger {
    background: #d6336c;
    color: white;
}

.btn-warning {
    background: #f59f00;
    color: white;
}

.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 15px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-family: inherit;
    background: white;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: center;
    font-size: 13px;
}

th {
    background: #f1f3f5;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.badge-waiting {
    background: #e7f5ff;
    color: #1971c2;
}

.badge-turn {
    background: #fff3bf;
    color: #9c6500;
}

.badge-free {
    background: #d3f9d8;
    color: #2b8a3e;
}

.badge-reserved {
    background: #e5dbff;
    color: #6741d9;
}

.badge-completed {
    background: #dee2e6;
    color: #495057;
}

.badge-urgent {
    background: #ffe3e3;
    color: #c92a2a;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: wrap;
}

.actions button {
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 600px;
    border-radius: 18px;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-box h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
}

.full {
    grid-column: 1 / -1;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
}

.checkbox input {
    width: auto;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.toast {
    position: fixed;
    left: 20px;
    bottom: 20px;
    background: #212529;
    color: white;
    padding: 13px 17px;
    border-radius: 10px;
    display: none;
    z-index: 2000;
    max-width: 90%;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 25px;
}

@media(max-width: 800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        grid-template-columns: 1fr 1fr;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}

@media(max-width: 500px) {

    .container {
        padding: 10px;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>پنل مدیریت صلایان بار</h1>
    <p>سامانه اعلام بار هوشمند</p>
</header>

<div class="container">

    <!-- آمار -->
    <div class="stats">

        <div class="stat">
            کاربران
            <strong id="usersCount">-</strong>
        </div>

        <div class="stat">
            رانندگان
            <strong id="driversCount">-</strong>
        </div>

        <div class="stat">
            کل بارها
            <strong id="loadsCount">-</strong>
        </div>

        <div class="stat">
            بارهای فعال
            <strong id="activeLoadsCount">-</strong>
        </div>

    </div>

    <!-- منو -->
    <div class="menu">

        <button onclick="scrollToLoads()">
            📦 مدیریت بارها
        </button>

        <button onclick="driverManagement()">
            🚛 مدیریت رانندگان
        </button>

        <button onclick="walletManagement()">
            💰 کیف پول و تراکنش‌ها
        </button>

        <button onclick="inquiryManagement()">
            🔍 استعلام‌ها
        </button>

        <button onclick="notificationManagement()">
            🔔 اعلان‌ها
        </button>

        <button onclick="settingsManagement()">
            ⚙️ تنظیمات سامانه
        </button>

    </div>

    <!-- مدیریت بارها -->
    <div class="panel" id="loadsPanel">

        <div class="panel-title">

            <h2>مدیریت بارها</h2>

            <div>
                <button class="btn btn-primary" onclick="openNewLoad()">
                    ➕ ثبت بار جدید
                </button>

                <button class="btn btn-secondary" onclick="refreshAll()">
                    🔄 بروزرسانی
                </button>
            </div>

        </div>

        <!-- فیلتر -->
        <div class="filters">

            <input
                id="searchInput"
                placeholder="جستجو در مبدأ، مقصد یا نوع بار..."
                oninput="filterLoads()"
            >

            <select id="statusFilter" onchange="filterLoads()">

                <option value="">همه وضعیت‌ها</option>
                <option value="waiting">در انتظار</option>
                <option value="turn">نوبتی</option>
                <option value="free">آزاد</option>
                <option value="reserved">رزرو شده</option>
                <option value="completed">تکمیل شده</option>

            </select>

            <select id="urgentFilter" onchange="filterLoads()">

                <option value="">همه</option>
                <option value="true">فقط فوری</option>
                <option value="false">غیرفوری</option>

            </select>

            <button class="btn btn-secondary" onclick="clearFilters()">
                پاک کردن
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>مبدأ</th>
                        <th>مقصد</th>
                        <th>بار</th>
                        <th>وزن</th>
                        <th>نوع کامیون</th>
                        <th>وضعیت</th>
                        <th>فوری</th>
                        <th>تاریخ</th>
                        <th>عملیات</th>
                    </tr>

                </thead>

                <tbody id="loadsTable">

                    <tr>
                        <td colspan="10" class="loading">
                            در حال دریافت اطلاعات...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->
<div class="modal" id="loadModal">

    <div class="modal-box">

        <h2 id="modalTitle">ثبت بار جدید</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>مبدأ</label>
                <input id="origin" placeholder="مثلاً قاین">
            </div>

            <div class="form-group">
                <label>مقصد</label>
                <input id="destination" placeholder="مثلاً مشهد">
            </div>

            <div class="form-group">
                <label>نوع بار</label>
                <input id="cargo" placeholder="مثلاً فولاد">
            </div>

            <div class="form-group">
                <label>وزن</label>
                <input
                    id="weight"
                    type="number"
                    step="0.01"
                    placeholder="مثلاً 25"
                >
            </div>

            <div class="form-group full">
                <label>نوع کامیون</label>
                <input
                    id="truck_type"
                    placeholder="مثلاً کمپرسی"
                >
            </div>

            <div class="form-group">
                <label>وضعیت بار</label>

                <select id="load_status">

                    <option value="waiting">در انتظار</option>
                    <option value="turn" selected>نوبتی</option>
                    <option value="free">آزاد</option>
                    <option value="reserved">رزرو شده</option>
                    <option value="completed">تکمیل شده</option>

                </select>

            </div>

            <div class="form-group">

                <label>فوری</label>

                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="urgent"
                    >

                    بار فوری

                </label>

            </div>

        </div>

        <div class="modal-actions">

            <button
                class="btn btn-primary"
                onclick="saveLoad()"
            >
                ذخیره بار
            </button>

            <button
                class="btn btn-secondary"
                onclick="closeModal()"
            >
                انصراف
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ntirixjflgqihobpnmya.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_eqsmcIqZz_YAMEbmvMEXVw_VBd6YZJ2";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   VARIABLES
========================= */

let allLoads = [];
let editingLoadId = null;


/* =========================
   START
========================= */

document.addEventListener("DOMContentLoaded", async () => {

    await checkAdmin();

});


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

    try {

        const { data: authData, error: authError } =
            await client.auth.getUser();

        if (authError) {
            throw authError;
        }

        const user = authData.user;

        if (!user) {

            document.body.innerHTML =
                "<h2 style='text-align:center;padding:50px'>ابتدا وارد سامانه شوید.</h2>";

            return;
        }

        const { data: profile, error: profileError } =
            await client
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .single();

        if (profileError) {
            throw profileError;
        }

        if (!profile || profile.role !== "admin") {

            document.body.innerHTML =
                "<h2 style='text-align:center;padding:50px;color:#c92a2a'>دسترسی فقط برای مدیر سامانه مجاز است.</h2>";

            return;
        }

        await refreshAll();

    } catch (error) {

        console.error(error);

        document.body.innerHTML =
            `
            <div style="text-align:center;padding:50px">
                <h2>خطا در بررسی دسترسی</h2>
                <p>${safe(error.message)}</p>
            </div>
            `;

    }

}


/* =========================
   REFRESH
========================= */

async function refreshAll() {

    await loadDashboard();

    await loadLoads();

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard() {

    try {

        const usersResult = await client
            .from("profiles")
            .select("id", { count: "exact", head: true });

        const driversResult = await client
            .from("drivers")
            .select("id", { count: "exact", head: true });

        const loadsResult = await client
            .from("loads")
            .select("id", { count: "exact", head: true });

        const activeResult = await client
            .from("loads")
            .select("id", { count: "exact", head: true })
            .in("status", ["waiting", "turn", "free"]);

        document.getElementById("usersCount").textContent =
            usersResult.count ?? 0;

        document.getElementById("driversCount").textContent =
            driversResult.count ?? 0;

        document.getElementById("loadsCount").textContent =
            loadsResult.count ?? 0;

        document.getElementById("activeLoadsCount").textContent =
            activeResult.count ?? 0;

    } catch (error) {

        console.error("DASHBOARD ERROR:", error);

    }

}


/* =========================
   LOADS
========================= */

async function loadLoads() {

    const table = document.getElementById("loadsTable");

    table.innerHTML =
        `
        <tr>
            <td colspan="10" class="loading">
                در حال دریافت اطلاعات...
            </td>
        </tr>
        `;

    const { data, error } = await client
        .from("loads")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

        console.error("LOADS ERROR:", error);

        table.innerHTML =
            `
            <tr>
                <td colspan="10" class="empty">
                    خطا در دریافت بارها
                </td>
            </tr>
            `;

        return;
    }

    allLoads = data || [];

    renderLoads(allLoads);

}


/* =========================
   RENDER
========================= */

function renderLoads(loads) {

    const table =
        document.getElementById("loadsTable");

    if (!loads.length) {

        table.innerHTML =
            `
            <tr>
                <td colspan="10" class="empty">
                    هیچ باری پیدا نشد.
                </td>
            </tr>
            `;

        return;
    }

    table.innerHTML = loads.map((load, index) => {

        return `
        <tr>

            <td>${index + 1}</td>

            <td>${safe(load.origin)}</td>

            <td>${safe(load.destination)}</td>

            <td>${safe(load.cargo)}</td>

            <td>${safe(load.weight)}</td>

            <td>${safe(load.truck_type || "-")}</td>

            <td>
                ${statusBadge(load.status)}
            </td>

            <td>
                ${
                    load.urgent
                        ? '<span class="badge badge-urgent">فوری</span>'
                        : '-'
                }
            </td>

            <td>
                ${formatDate(load.created_at)}
            </td>

            <td>

                <div class="actions">

                    <button
                        class="btn-secondary"
                        onclick="editLoad('${load.id}')"
                    >
                        ویرایش
                    </button>

                    <button
                        class="btn-warning"
                        onclick="changeStatus('${load.id}')"
                    >
                        وضعیت
                    </button>

                    <button
                        class="btn-danger"
                        onclick="deleteLoad('${load.id}')"
                    >
                        حذف
                    </button>

                </div>

            </td>

        </tr>
        `;

    }).join("");

}


/* =========================
   STATUS BADGE
========================= */

function statusBadge(status) {

    const names = {

        waiting: "در انتظار",

        turn: "نوبتی",

        free: "آزاد",

        reserved: "رزرو شده",

        completed: "تکمیل شده"

    };

    const classes = {

        waiting: "badge-waiting",

        turn: "badge-turn",

        free: "badge-free",

        reserved: "badge-reserved",

        completed: "badge-completed"

    };

    return `
        <span class="badge ${classes[status] || "badge-completed"}">
            ${names[status] || status || "-"}
        </span>
    `;

}


/* =========================
   FILTER
========================= */

function filterLoads() {

    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById("statusFilter")
        .value;

    const urgent =
        document.getElementById("urgentFilter")
        .value;

    const filtered = allLoads.filter(load => {

        const text = `
            ${load.origin || ""}
            ${load.destination || ""}
            ${load.cargo || ""}
            ${load.truck_type || ""}
        `.toLowerCase();

        if (
            search &&
            !text.includes(search)
        ) {
            return false;
        }

        if (
            status &&
            load.status !== status
        ) {
            return false;
        }

        if (
            urgent &&
            String(load.urgent) !== urgent
        ) {
            return false;
        }

        return true;

    });

    renderLoads(filtered);

}


function clearFilters() {

    document.getElementById("searchInput").value = "";

    document.getElementById("statusFilter").value = "";

    document.getElementById("urgentFilter").value = "";

    renderLoads(allLoads);

}


/* =========================
   NEW LOAD
========================= */

function openNewLoad() {

    editingLoadId = null;

    document.getElementById("modalTitle").textContent =
        "ثبت بار جدید";

    document.getElementById("origin").value = "";

    document.getElementById("destination").value = "";

    document.getElementById("cargo").value = "";

    document.getElementById("weight").value = "";

    document.getElementById("truck_type").value = "";

    document.getElementById("load_status").value = "turn";

    document.getElementById("urgent").checked = false;

    document.getElementById("loadModal").style.display =
        "flex";

}


/* =========================
   EDIT
========================= */

function editLoad(id) {

    const load =
        allLoads.find(item => item.id === id);

    if (!load) {

        alert("بار پیدا نشد.");

        return;
    }

    editingLoadId = id;

    document.getElementById("modalTitle").textContent =
        "ویرایش بار";

    document.getElementById("origin").value =
        load.origin || "";

    document.getElementById("destination").value =
        load.destination || "";

    document.getElementById("cargo").value =
        load.cargo || "";

    document.getElementById("weight").value =
        load.weight || "";

    document.getElementById("truck_type").value =
        load.truck_type || "";

    document.getElementById("load_status").value =
        load.status || "turn";

    document.getElementById("urgent").checked =
        !!load.urgent;

    document.getElementById("loadModal").style.display =
        "flex";

}


/* =========================
   SAVE LOAD
========================= */

async function saveLoad() {

    try {

        const origin =
            document.getElementById("origin")
            .value
            .trim();

        const destination =
            document.getElementById("destination")
            .value
            .trim();

        const cargo =
            document.getElementById("cargo")
            .value
            .trim();

        const weightValue =
            document.getElementById("weight")
            .value;

        const truck_type =
            document.getElementById("truck_type")
            .value
            .trim();

        const status =
            document.getElementById("load_status")
            .value;

        const urgent =
            document.getElementById("urgent")
            .checked;


        /* اعتبارسنجی */

        if (
            !origin ||
            !destination ||
            !cargo ||
            !weightValue
        ) {

            alert(
                "مبدأ، مقصد، نوع بار و وزن را کامل وارد کنید."
            );

            return;
        }


        const weight =
            Number(weightValue);


        if (
            !Number.isFinite(weight) ||
            weight <= 0
        ) {

            alert("وزن وارد شده صحیح نیست.");

            return;
        }


        /* کاربر */

        const { data: authData, error: authError } =
            await client.auth.getUser();

        if (authError) {
            throw authError;
        }

        const user =
            authData.user;


        if (!user) {

            throw new Error(
                "کاربر وارد سیستم نشده است."
            );

        }


        /* اطلاعات بار */

        const loadData = {

            origin: origin,

            destination: destination,

            cargo: cargo,

            weight: weight,

            truck_type:
                truck_type || null,

            status: status,

            urgent: urgent,

            created_by: user.id

        };


        console.log(
            "USER ID:",
            user.id
        );

        console.log(
            "LOAD DATA:",
            loadData
        );


        let result;


        /* ویرایش */

        if (editingLoadId) {

            result = await client
                .from("loads")
                .update(loadData)
                .eq("id", editingLoadId)
                .select();


        /* ثبت جدید */

        } else {

            result = await client
                .from("loads")
                .insert(loadData)
                .select();

        }


        /* خطای Supabase */

        if (result.error) {

            console.error(
                "SUPABASE SAVE ERROR:",
                result.error
            );


            const errorText =

                "Message: " +
                (result.error.message || "") +

                "\n\nDetails: " +
                (result.error.details || "") +

                "\n\nHint: " +
                (result.error.hint || "") +

                "\n\nCode: " +
                (result.error.code || "");


            alert(
                "خطای واقعی ثبت بار:\n\n" +
                errorText
            );


            return;
        }


        /* موفق */

        console.log(
            "LOAD SAVED:",
            result.data
        );


        alert(
            editingLoadId
                ? "بار با موفقیت ویرایش شد ✅"
                : "بار جدید با موفقیت ثبت شد ✅"
        );


        closeModal();

        await refreshAll();


    } catch (error) {

        console.error(
            "SAVE LOAD ERROR:",
            error
        );


        alert(
            "خطای ثبت بار:\n\n" +
            (
                error?.message ||
                String(error) ||
                "خطای نامشخص"
            )
        );

    }

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(id) {

    const load =
        allLoads.find(item => item.id === id);

    if (!load) return;


    const newStatus =
        prompt(
            "وضعیت جدید را وارد کنید:\n\n" +
            "waiting = در انتظار\n" +
            "turn = نوبتی\n" +
            "free = آزاد\n" +
            "reserved = رزرو شده\n" +
            "completed = تکمیل شده",
            load.status
        );


    if (!newStatus) return;


    const allowed = [
        "waiting",
        "turn",
        "free",
        "reserved",
        "completed"
    ];


    if (!allowed.includes(newStatus)) {

        alert(
            "وضعیت وارد شده معتبر نیست."
        );

        return;
    }


    const { error } =
        await client
            .from("loads")
            .update({
                status: newStatus
            })
            .eq("id", id);


    if (error) {

        alert(
            "خطا در تغییر وضعیت:\n\n" +
            error.message
        );

        return;
    }


    showToast(
        "وضعیت بار تغییر کرد."
    );


    await refreshAll();

}


/* =========================
   DELETE
========================= */

async function deleteLoad(id) {

    const load =
        allLoads.find(item => item.id === id);


    if (!load) return;


    const confirmed =
        confirm(
            `آیا از حذف بار «${load.origin} → ${load.destination}» مطمئن هستید؟`
        );


    if (!confirmed) return;


    const { error } =
        await client
            .from("loads")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "خطا در حذف بار:\n\n" +
            error.message
        );

        return;
    }


    showToast(
        "بار حذف شد."
    );


    await refreshAll();

}

/* =========================
   HELPERS
========================= */

function safe(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatDate(value) {

    if (!value) return "-";

    try {

        return new Date(value)
            .toLocaleString("fa-IR");

    } catch {

        return value;

    }

}


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(() => {

        toast.style.display =
            "none";

    }, 3000);

}
