<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت صلایان بار نیمبلوک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f6f4;
    color:#222;
}

header{
    background:#087f3e;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    cursor:pointer;
    font-family:inherit;
}

.btn-green{background:#087f3e;color:white}
.btn-red{background:#c62828;color:white}
.btn-blue{background:#1976d2;color:white}
.btn-gray{background:#777;color:white}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px #00000012;
    text-align:center;
}

.stat .num{
    font-size:28px;
    font-weight:bold;
    color:#087f3e;
    margin-top:8px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:20px;
}

.menu button{
    background:white;
    border:1px solid #ddd;
    padding:15px 8px;
}

.menu button:hover{
    background:#eaf7ef;
}

.section{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px #00000012;
}

.section h2{
    margin-top:0;
    color:#087f3e;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

input,select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:9px;
    font-family:inherit;
}

input{
    min-width:180px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:center;
}

th{
    background:#edf6f0;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    display:inline-block;
}

.waiting{background:#fff3cd;color:#856404}
.turn{background:#d1ecf1;color:#0c5460}
.free{background:#d4edda;color:#155724}
.reserved{background:#cce5ff;color:#004085}
.completed{background:#e2e3e5;color:#383d41}

.status-select{
    min-width:120px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    border-radius:18px;
    padding:25px;
    max-height:90vh;
    overflow:auto;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-grid .full{
    grid-column:1/-1;
}

.form-grid label{
    display:block;
    margin-bottom:5px;
    font-size:13px;
}

.form-grid input,
.form-grid select{
    width:100%;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.toast{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    display:none;
    z-index:3000;
}

.driver-card{
    display:none;
}

.driver-active{
    background:#d4edda;
    color:#155724;
}

.driver-disabled{
    background:#f8d7da;
    color:#721c24;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    .container{
        padding:10px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .menu{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-grid .full{
        grid-column:auto;
    }

    .driver-card{
        display:block;
        background:#fff;
        border:1px solid #eee;
        border-radius:12px;
        padding:15px;
        margin-bottom:10px;
    }

    .driver-table{
        display:none;
    }
}
</style>
</head>

<body>

<header>
    🚛 صلایان بار نیمبلوک
    <div style="font-size:13px;margin-top:5px;font-weight:normal">
        پنل مدیریت سامانه
    </div>
</header>

<div class="container">

<div class="topbar">
    <div>
        <b>مدیریت سامانه</b>
    </div>

    <div>
        <button class="btn-green" onclick="refreshAll()">🔄 بروزرسانی</button>
        <button class="btn-red" onclick="logout()">خروج</button>
    </div>
</div>

<!-- آمار -->
<div class="stats">

    <div class="stat">
        کاربران
        <div class="num" id="usersCount">0</div>
    </div>

    <div class="stat">
        رانندگان
        <div class="num" id="driversCount">0</div>
    </div>

    <div class="stat">
        کل بارها
        <div class="num" id="loadsCount">0</div>
    </div>

    <div class="stat">
        بارهای فعال
        <div class="num" id="activeLoadsCount">0</div>
    </div>

</div>

<!-- منو -->
<div class="menu">

    <button onclick="scrollToLoads()">
        🚚<br>مدیریت بارها
    </button>

    <button onclick="scrollToDrivers()">
        👤<br>مدیریت رانندگان
    </button>

    <button onclick="showToast('بخش کیف پول در مرحله بعد تکمیل می‌شود')">
        💰<br>کیف پول
    </button>

    <button onclick="showToast('بخش استعلام‌ها در مرحله بعد تکمیل می‌شود')">
        🔍<br>استعلام‌ها
    </button>

    <button onclick="showToast('بخش اعلان‌ها در مرحله بعد تکمیل می‌شود')">
        🔔<br>اعلان‌ها
    </button>

    <button onclick="showToast('تنظیمات سامانه در مرحله بعد تکمیل می‌شود')">
        ⚙️<br>تنظیمات
    </button>

</div>


<!-- ================= مدیریت بارها ================= -->

<div class="section" id="loadsSection">

<h2>🚚 مدیریت بارها</h2>

<div class="filters">

<input
    id="loadSearch"
    placeholder="جستجوی مبدأ، مقصد، بار..."
    oninput="filterLoads()">

<select id="loadStatusFilter" onchange="filterLoads()">
    <option value="">همه وضعیت‌ها</option>
    <option value="waiting">در انتظار</option>
    <option value="turn">نوبتی</option>
    <option value="free">آزاد</option>
    <option value="reserved">رزرو شده</option>
    <option value="completed">تکمیل شده</option>
</select>

<select id="urgentFilter" onchange="filterLoads()">
    <option value="">همه</option>
    <option value="true">فوری</option>
    <option value="false">عادی</option>
</select>

<button class="btn-gray" onclick="clearLoadFilters()">پاک کردن فیلتر</button>

<button class="btn-green" onclick="openNewLoad()">➕ ثبت بار جدید</button>

</div>

<div class="table-wrap">

<table>
<thead>
<tr>
<th>#</th>
<th>مبدأ</th>
<th>مقصد</th>
<th>نوع بار</th>
<th>وزن</th>
<th>نوع کامیون</th>
<th>وضعیت</th>
<th>فوری</th>
<th>تاریخ</th>
<th>عملیات</th>
</tr>
</thead>

<tbody id="loadsTable"></tbody>

</table>

</div>

</div>


<!-- ================= مدیریت رانندگان ================= -->

<div class="section" id="driversSection">

<h2>👤 مدیریت رانندگان</h2>

<div class="filters">

<input
    id="driverSearch"
    placeholder="جستجوی نام یا شماره موبایل..."
    oninput="filterDrivers()">

<select id="driverRoleFilter" onchange="filterDrivers()">
    <option value="">همه نقش‌ها</option>
    <option value="driver">راننده</option>
    <option value="owner">مالک بار</option>
    <option value="company">شرکت</option>
    <option value="admin">مدیر</option>
</select>

<button class="btn-gray" onclick="clearDriverFilters()">
    پاک کردن فیلتر
</button>

<button class="btn-green" onclick="loadDrivers()">
    🔄 بروزرسانی رانندگان
</button>

</div>


<div class="table-wrap driver-table">

<table>

<thead>
<tr>
<th>#</th>
<th>نام</th>
<th>موبایل</th>
<th>نقش</th>
<th>وضعیت</th>
<th>کامیون</th>
<th>کیف پول</th>
<th>تاریخ عضویت</th>
<th>عملیات</th>
</tr>
</thead>

<tbody id="driversTable"></tbody>

</table>

</div>

<div id="driversMobile"></div>

</div>

</div>


<!-- ================= مودال بار ================= -->

<div class="modal" id="loadModal">

<div class="modal-box">

<h2 id="loadModalTitle">ثبت بار جدید</h2>

<input type="hidden" id="editLoadId">

<div class="form-grid">

<div>
<label>مبدأ</label>
<input id="origin">
</div>

<div>
<label>مقصد</label>
<input id="destination">
</div>

<div>
<label>نوع بار</label>
<input id="cargo">
</div>

<div>
<label>وزن</label>
<input id="weight" type="number">
</div>

<div>
<label>نوع کامیون</label>
<input id="truck_type">
</div>

<div>
<label>وضعیت</label>

<select id="load_status">

<option value="waiting">در انتظار</option>
<option value="turn">نوبتی</option>
<option value="free">آزاد</option>
<option value="reserved">رزرو شده</option>
<option value="completed">تکمیل شده</option>

</select>

</div>

<div class="full">

<label>
<input type="checkbox" id="urgent">
بار فوری
</label>

</div>

</div>

<div class="modal-actions">

<button class="btn-green" onclick="saveLoad()">
ذخیره
</button>

<button class="btn-gray" onclick="closeLoadModal()">
انصراف
</button>

</div>

</div>

</div>


<!-- ================= مودال راننده ================= -->

<div class="modal" id="driverModal">

<div class="modal-box">

<h2>👤 اطلاعات راننده</h2>

<div id="driverDetails"></div>

<div class="modal-actions">

<button class="btn-gray" onclick="closeDriverModal()">
بستن
</button>

</div>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

const SUPABASE_URL =
"https://ntirixjflgqihobpnmya.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_eqsmcIqZz_YAMEbmvMEXVw_VBd6YZJ2";

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


let currentUser = null;

let allLoads = [];
let allDrivers = [];


/* ================= شروع ================= */

document.addEventListener("DOMContentLoaded", async () => {

    await checkAdmin();

});


/* ================= بررسی ادمین ================= */

async function checkAdmin(){

    try{

        const {
            data:{user},
            error
        } = await client.auth.getUser();

        if(error || !user){

            alert("جلسه ورود پیدا نشد");

            location.href = "index.html";

            return;
        }

        currentUser = user;

        const {data:profile,error:profileError} =
        await client
        .from("profiles")
        .select("id,phone,role")
        .eq("id",user.id)
        .maybeSingle();

        if(profileError){

            alert("خطا در بررسی مدیر: " + profileError.message);

            return;
        }

        if(!profile || profile.role !== "admin"){

            alert("دسترسی شما به پنل مدیریت مجاز نیست");

            location.href = "index.html";

            return;
        }

        await refreshAll();

    }catch(err){

        alert("خطای واقعی: " + err.message);

    }

}


/* ================= بروزرسانی همه ================= */

async function refreshAll(){

    await loadDashboard();

    await loadLoads();

    await loadDrivers();

}


/* ================= داشبورد ================= */

async function loadDashboard(){

    try{

        const {count:usersCount,error:uError} =
        await client
        .from("profiles")
        .select("*",{count:"exact",head:true});

        if(!uError)
            document.getElementById("usersCount").innerText =
            usersCount || 0;


        const {count:driversCount,error:dError} =
        await client
        .from("drivers")
        .select("*",{count:"exact",head:true});

        if(!dError)
            document.getElementById("driversCount").innerText =
            driversCount || 0;


        const {count:loadsCount,error:lError} =
        await client
        .from("loads")
        .select("*",{count:"exact",head:true});

        if(!lError)
            document.getElementById("loadsCount").innerText =
            loadsCount || 0;


        const {count:activeCount,error:aError} =
        await client
        .from("loads")
        .select("*",{count:"exact",head:true})
        .in("status",["waiting","turn","free"]);

        if(!aError)
            document.getElementById("activeLoadsCount").innerText =
            activeCount || 0;

    }catch(err){

        console.error(err);

    }

}


/* ================= بارها ================= */

async function loadLoads(){

    const {data,error} =
    await client
    .from("loads")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        alert("خطا در دریافت بارها:\n" + error.message);

        return;
    }

    allLoads = data || [];

    renderLoads(allLoads);

}


function renderLoads(list){

    const tbody =
    document.getElementById("loadsTable");

    tbody.innerHTML = "";

    list.forEach((load,index)=>{

        const tr =
        document.createElement("tr");

        tr.innerHTML = `

        <td>${index+1}</td>

        <td>${safe(load.origin)}</td>

        <td>${safe(load.destination)}</td>

        <td>${safe(load.cargo)}</td>

        <td>${safe(load.weight)}</td>

        <td>${safe(load.truck_type)}</td>

        <td>
            ${statusSelect(load)}
        </td>

        <td>
            ${load.urgent ? "🔴 فوری" : "عادی"}
        </td>

        <td>
            ${formatDate(load.created_at)}
        </td>

        <td>

            <button
            class="btn-blue"
            onclick="editLoad('${load.id}')">
            ویرایش
            </button>

            <button
            class="btn-red"
            onclick="deleteLoad('${load.id}')">
            حذف
            </button>

        </td>

        `;

        tbody.appendChild(tr);

    });

}


function statusSelect(load){

    const statuses = [
        ["waiting","در انتظار"],
        ["turn","نوبتی"],
        ["free","آزاد"],
        ["reserved","رزرو شده"],
        ["completed","تکمیل شده"]
    ];

    return `
    <select
        class="status-select"
        onchange="changeStatus('${load.id}',this.value)"
    >
        ${
            statuses.map(s=>`
                <option
                    value="${s[0]}"
                    ${load.status===s[0]?"selected":""}
                >
                    ${s[1]}
                </option>
            `).join("")
        }
    </select>
    `;

}


/* ================= تغییر وضعیت ================= */

async function changeStatus(id,newStatus){

    const {error} =
    await client
    .from("loads")
    .update({
        status:newStatus
    })
    .eq("id",id);

    if(error){

        alert("خطا در تغییر وضعیت:\n" + error.message);

        await loadLoads();

        return;
    }

    showToast("وضعیت بار با موفقیت تغییر کرد");

    await loadLoads();

}


/* ================= فیلتر بار ================= */

function filterLoads(){

    const search =
    document
    .getElementById("loadSearch")
    .value
    .trim()
    .toLowerCase();

    const status =
    document
    .getElementById("loadStatusFilter")
    .value;

    const urgent =
    document
    .getElementById("urgentFilter")
    .value;


    const result =
    allLoads.filter(load=>{

        const text =
        `${load.origin||""} ${load.destination||""} ${load.cargo||""}`
        .toLowerCase();

        if(search && !text.includes(search))
            return false;

        if(status && load.status !== status)
            return false;

        if(urgent !== ""){

            const wanted =
            urgent === "true";

            if(Boolean(load.urgent) !== wanted)
                return false;
        }

        return true;

    });

    renderLoads(result);

}


function clearLoadFilters(){

    document.getElementById("loadSearch").value="";
    document.getElementById("loadStatusFilter").value="";
    document.getElementById("urgentFilter").value="";

    renderLoads(allLoads);

}


/* ================= ثبت بار ================= */

function openNewLoad(){

    document.getElementById("loadModalTitle").innerText =
    "ثبت بار جدید";

    document.getElementById("editLoadId").value="";

    document.getElementById("origin").value="";
    document.getElementById("destination").value="";
    document.getElementById("cargo").value="";
    document.getElementById("weight").value="";
    document.getElementById("truck_type").value="";
    document.getElementById("load_status").value="turn";
    document.getElementById("urgent").checked=false;

    document.getElementById("loadModal").style.display="flex";

}


function editLoad(id){

    const load =
    allLoads.find(x=>x.id===id);

    if(!load)
        return;

    document.getElementById("loadModalTitle").innerText =
    "ویرایش بار";

    document.getElementById("editLoadId").value =
    load.id;

    document.getElementById("origin").value =
    load.origin || "";

    document.getElementById("destination").value =
    load.destination || "";

    document.getElementById("cargo").value =
    load.cargo || "";

    document.getElementById("weight").value =
    load.weight || "";

    document.getElementById("truck_type").value =
    load.truck_type || "";

    document.getElementById("load_status").value =
    load.status || "turn";

    document.getElementById("urgent").checked =
    Boolean(load.urgent);

    document.getElementById("loadModal").style.display="flex";

}


async function saveLoad(){

    try{

        const id =
        document.getElementById("editLoadId").value;

        const loadData = {

            origin:
            document.getElementById("origin").value.trim(),

            destination:
            document.getElementById("destination").value.trim(),

            cargo:
            document.getElementById("cargo").value.trim(),

            weight:
            Number(document.getElementById("weight").value || 0),

            truck_type:
            document.getElementById("truck_type").value.trim(),

            status:
            document.getElementById("load_status").value,

            urgent:
            document.getElementById("urgent").checked

        };


        if(!loadData.origin ||
           !loadData.destination ||
           !loadData.cargo){

            alert("مبدأ، مقصد و نوع بار الزامی است");

            return;
        }


        if(id){

            const {error} =
            await client
            .from("loads")
            .update(loadData)
            .eq("id",id);

            if(error){

                alert("خطای واقعی ویرایش بار:\n" + error.message);

                return;
            }

            showToast("بار با موفقیت ویرایش شد");

        }else{

            loadData.created_by =
            currentUser.id;

            const {error} =
            await client
            .from("loads")
            .insert(loadData);

            if(error){

                alert("خطای واقعی ثبت بار:\n" + error.message);

                return;
            }

            showToast("بار با موفقیت ثبت شد");

        }


        closeLoadModal();

        await loadLoads();

        await loadDashboard();

    }catch(err){

        alert("خطای واقعی:\n" + err.message);

    }

}


async function deleteLoad(id){

    if(!confirm("آیا از حذف این بار مطمئن هستید؟"))
        return;


    const {error} =
    await client
    .from("loads")
    .delete()
    .eq("id",id);


    if(error){

        alert("خطا در حذف بار:\n" + error.message);

        return;
    }

    showToast("بار حذف شد");

    await loadLoads();

    await loadDashboard();

}


function closeLoadModal(){

    document.getElementById("loadModal").style.display="none";

}


/* ================= رانندگان ================= */

async function loadDrivers(){

    try{

        const {data:profiles,error:pError} =
        await client
        .from("profiles")
        .select("*")
        .order("created_at",{ascending:false});


        if(pError){

            alert("خطا در دریافت کاربران:\n" + pError.message);

            return;
        }


        const {data:drivers,error:dError} =
        await client
        .from("drivers")
        .select("*");


        if(dError){

            alert("خطا در دریافت رانندگان:\n" + dError.message);

            return;
        }


        let wallets = [];

        const walletResult =
        await client
        .from("wallets")
        .select("*");

        if(!walletResult.error)
            wallets = walletResult.data || [];


        allDrivers =
        (profiles || []).map(profile=>{

            const driver =
            (drivers || []).find(d=>
                d.user_id === profile.id ||
                d.profile_id === profile.id
            );

            const wallet =
            wallets.find(w=>
                w.user_id === profile.id
            );


            return {

                profile:profile,

                driver:driver || null,

                wallet:wallet || null

            };

        });


        filterDrivers();

    }catch(err){

        alert("خطای واقعی رانندگان:\n" + err.message);

    }

}


function driverName(item){

    const p = item.profile || {};
    const d = item.driver || {};

    return (
        d.full_name ||
        d.name ||
        p.full_name ||
        p.name ||
        p.first_name ||
        "بدون نام"
    );

}


function driverPhone(item){

    const p = item.profile || {};
    const d = item.driver || {};

    return (
        p.phone ||
        d.phone ||
        d.mobile ||
        "ثبت نشده"
    );

}


function driverTruck(item){

    const d = item.driver || {};

    return (
        d.truck_type ||
        d.vehicle_type ||
        d.truck ||
        d.vehicle ||
        "ثبت نشده"
    );

}


function driverWallet(item){

    const w = item.wallet || {};

    const balance =
    Number(
        w.balance ??
        w.amount ??
        0
    );

    return balance.toLocaleString("fa-IR") + " تومان";

}


function driverActive(item){

    const d = item.driver || {};
    const p = item.profile || {};

    if(
        d.is_active === false ||
        p.is_active === false
    )
        return false;

    return true;

}


function driverRole(item){

    return item.profile?.role || "driver";

}


function roleText(role){

    const roles = {

        driver:"راننده",
        owner:"مالک بار",
        company:"شرکت",
        admin:"مدیر"

    };

    return roles[role] || role;

}


function filterDrivers(){

    const search =
    document
    .getElementById("driverSearch")
    .value
    .trim()
    .toLowerCase();

    const role =
    document
    .getElementById("driverRoleFilter")
    .value;


    const result =
    allDrivers.filter(item=>{

        const text =
        `${driverName(item)} ${driverPhone(item)}`
        .toLowerCase();

        if(search && !text.includes(search))
            return false;

        if(role && driverRole(item)!==role)
            return false;

        return true;

    });


    renderDrivers(result);

}


function renderDrivers(list){

    const tbody =
    document.getElementById("driversTable");

    const mobile =
    document.getElementById("driversMobile");

    tbody.innerHTML="";
    mobile.innerHTML="";


    list.forEach((item,index)=>{

        const active =
        driverActive(item);

        const tr =
        document.createElement("tr");


        tr.innerHTML = `

        <td>${index+1}</td>

        <td>${safe(driverName(item))}</td>

        <td>${safe(driverPhone(item))}</td>

        <td>
            ${roleText(driverRole(item))}
        </td>

        <td>
            <span class="badge ${
                active
                ? "driver-active"
                : "driver-disabled"
            }">
                ${active ? "فعال" : "غیرفعال"}
            </span>
        </td>

        <td>
            ${safe(driverTruck(item))}
        </td>

        <td>
            ${driverWallet(item)}
        </td>

        <td>
            ${formatDate(item.profile?.created_at)}
        </td>

        <td>

            <button
            class="btn-blue"
            onclick="viewDriver('${item.profile.id}')">
            مشاهده
            </button>

        </td>

        `;

        tbody.appendChild(tr);


        const card =
        document.createElement("div");

        card.className="driver-card";


        card.innerHTML = `

        <b>${safe(driverName(item))}</b>

        <hr>

        📱 ${safe(driverPhone(item))}<br><br>

        👤 نقش:
        ${roleText(driverRole(item))}<br><br>

        🚛 کامیون:
        ${safe(driverTruck(item))}<br><br>

        💰 کیف پول:
        ${driverWallet(item)}<br><br>

        <span class="badge ${
            active
            ? "driver-active"
            : "driver-disabled"
        }">
            ${active ? "فعال" : "غیرفعال"}
        </span>

        <br><br>

        <button
        class="btn-blue"
        onclick="viewDriver('${item.profile.id}')">
        مشاهده اطلاعات
        </button>

        `;


        mobile.appendChild(card);

    });

}


function clearDriverFilters(){

    document.getElementById("driverSearch").value="";
    document.getElementById("driverRoleFilter").value="";

    renderDrivers(allDrivers);

}


/* ================= جزئیات راننده ================= */

function viewDriver(id){

    const item =
    allDrivers.find(x=>
        x.profile &&
        x.profile.id === id
    );

    if(!item)
        return;


    const p = item.profile || {};
    const d = item.driver || {};
    const w = item.wallet || {};


    document.getElementById("driverDetails").innerHTML = `

        <div style="line-height:2">

            <b>نام:</b>
            ${safe(driverName(item))}
            <br>

            <b>شماره موبایل:</b>
            ${safe(driverPhone(item))}
            <br>

            <b>نقش:</b>
            ${roleText(driverRole(item))}
            <br>

            <b>وضعیت:</b>
            ${driverActive(item) ? "🟢 فعال" : "🔴 غیرفعال"}
            <br>

            <b>نوع کامیون:</b>
            ${safe(driverTruck(item))}
            <br>

            <b>موجودی کیف پول:</b>
            ${
                Number(
                    w.balance ??
                    w.amount ??
                    0
                ).toLocaleString("fa-IR")
            }
            تومان

            <hr>

            <b>شناسه کاربر:</b>
            <small>${safe(p.id)}</small>

        </div>

    `;


    document.getElementById("driverModal").style.display="flex";

}


function closeDriverModal(){

    document.getElementById("driverModal").style.display="none";

}


/* ================= ابزارها ================= */

function scrollToLoads(){

    document
    .getElementById("loadsSection")
    .scrollIntoView({
        behavior:"smooth"
    });

}


function scrollToDrivers(){

    document
    .getElementById("driversSection")
    .scrollIntoView({
        behavior:"smooth"
    });

}


function safe(value){

    if(value === null ||
       value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatDate(date){

    if(!date)
        return "-";

    try{

        return new Date(date)
        .toLocaleDateString("fa-IR");

    }catch(e){

        return "-";

    }

}


function showToast(message){

    const toast =
    document.getElementById("toast");

    toast.innerText=message;

    toast.style.display="block";

    setTimeout(()=>{
        toast.style.display="none";
    },2500);

}


async function logout(){

    await client.auth.signOut();

    location.href="index.html";

}
