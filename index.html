<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صلایان بار نیمبلوک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

button,
input,
select{
    font-family:inherit;
}

.header{
    background:#087f5b;
    color:white;
    padding:16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header small{
    display:block;
    margin-top:5px;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2,
.card h3{
    margin-top:0;
}

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#087f5b;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
}

.btn:active{
    transform:scale(.98);
}

.btn.secondary{
    background:#e9efed;
    color:#087f5b;
}

.btn.danger{
    background:#c92a2a;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:11px;
    margin:6px 0 10px;
    font-size:15px;
    background:white;
}

label{
    display:block;
    font-size:14px;
    margin-top:8px;
}

.hidden{
    display:none !important;
}

/* وضعیت مدارک */

.status-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.status-btn{
    width:100%;
    min-height:105px;
    border:1px solid #dfe7e4;
    border-radius:15px;
    background:white;
    padding:12px;
    cursor:pointer;
    text-align:right;
    transition:.15s;
    box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.status-btn:hover{
    transform:translateY(-2px);
}

.status-btn:active{
    transform:scale(.97);
}

.status-icon{
    font-size:25px;
    margin-bottom:6px;
}

.status-title{
    font-size:14px;
    font-weight:bold;
}

.status-state{
    font-size:12px;
    margin-top:7px;
    font-weight:bold;
}

.status-btn.ok{
    border-right:5px solid #2b8a3e;
}

.status-btn.ok .status-state{
    color:#2b8a3e;
}

.status-btn.expired{
    border-right:5px solid #c92a2a;
}

.status-btn.expired .status-state{
    color:#c92a2a;
}

.status-btn.warning{
    border-right:5px solid #e67700;
}

.status-btn.warning .status-state{
    color:#e67700;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.quick-btn{
    border:0;
    background:#eef7f3;
    color:#087f5b;
    padding:15px 8px;
    border-radius:13px;
    cursor:pointer;
    font-weight:bold;
}

.load-item{
    border:1px solid #e2e7e5;
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    background:white;
}

.load-item h3{
    margin:0 0 8px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    margin-bottom:8px;
}

.badge.turn{
    background:#fff3bf;
    color:#8d6500;
}

.badge.free{
    background:#d3f9d8;
    color:#2b8a3e;
}

.badge.reserved{
    background:#d0ebff;
    color:#1864ab;
}

.badge.waiting{
    background:#e7f5ff;
    color:#1971c2;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin:5px 0;
    font-size:14px;
}

.money{
    font-size:25px;
    font-weight:bold;
    color:#087f5b;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.menu-btn{
    border:0;
    background:white;
    border-radius:13px;
    padding:15px 8px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    cursor:pointer;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:18px;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal h3{
    margin-top:0;
}

.notice{
    background:#fff9db;
    border-right:4px solid #f08c00;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.8;
}

.success{
    background:#ebfbee;
    border-right:4px solid #2b8a3e;
    padding:12px;
    border-radius:10px;
}

.error{
    background:#fff5f5;
    border-right:4px solid #c92a2a;
    padding:12px;
    border-radius:10px;
}

.loading{
    text-align:center;
    padding:20px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:12px;
    padding:25px 10px;
}

@media(max-width:480px){
    .status-grid{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>
